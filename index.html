  /* ---------- 出席 ---------- */
  function applyEdit(id, ds, rec) {
    const e = (S().attEdits || {})[`${id}|${ds}`];
    if (!e) return rec;
    if (e.absent) return { absent: true, reason: e.reason, edited: e };
    const inM = toMin(e.in), outM = toMin(e.out);
    return { in: inM, out: outM, brk: e.brk, home: e.home, work: Math.max(0, outM - inM - e.brk), edited: e };
  }
  function dayRows(ds) {
    return S().mine.map((u) => {
      if (u.isNew && ds < u.since) return { u, none: true };
      if (ds === TODAY) {
        const e = (S().attEdits || {})[`${u.id}|${ds}`];
        if (e) { const r = applyEdit(u.id, ds, null); return { u, rec: r, state: r.absent ? 'absent' : 'left' }; }
        const st = dayState(u);
        if (st.status === 'absent') return { u, rec: { absent: true, reason: st.reason }, state: 'absent' };
        if (st.status === 'notyet') return { u, rec: null, state: 'notyet', expected: st.expected };
        return { u, rec: { in: st.inMin, out: st.outMin, brk: st.breakMin, home: st.home, work: st.workMin }, state: st.status };
      }
      const r = applyEdit(u.id, ds, (S().attendance[u.id] || {})[ds]);
      if (!r) return { u, none: true };
      return { u, rec: r, state: r.absent ? 'absent' : 'left' };
    });
  }
  const STATE_LABEL = { in: ['ok', '来ている'], left: ['mute', '帰った'], absent: ['mute', '休み'], notyet: ['warn', 'まだ'] };
  function pageAttendance(route) {
    const v = route.query.v === 'month' ? 'month' : 'day';
    const days = OCT();
    const ds = days.includes(route.query.d) ? route.query.d : TODAY;
    return {
      title: '出席', nav: 'attendance', wide: true,
      html: html`<div class="page st-att">
        <div class="page-head"><div class="ph-text"><h1>出席</h1><p class="lead">来た時間・帰った時間・休けい・取り組んだ時間の記録です。直す時は、理由を書きます。</p></div>
          <div class="ph-actions st-noprint"><button class="btn" type="button" data-act="st-csv" data-v="${v}" data-d="${ds}">${ic('download')}<span>CSVで保存</span></button><button class="btn" type="button" data-act="st-print">${ic('printer')}<span>印刷</span></button></div></div>
        <div class="seg st-noprint" role="tablist" aria-label="見かた"><a role="tab" href="#/staff/attendance?v=day&d=${ds}" aria-selected="${v === 'day'}">${ic('sun')}日ごと</a><a role="tab" href="#/staff/attendance?v=month" aria-selected="${v === 'month'}">${ic('table')}10月の一覧</a></div>
        ${v === 'day' ? dayView(ds, days) : monthView(days)}
      </div>`
    };
  }
  function dayView(ds, days) {
    const rows = dayRows(ds);
    const came = rows.filter((r) => r.rec && !r.rec.absent);
    const total = sum(came, (r) => r.rec.work || 0);
    return html`
      <div class="filters st-days st-noprint" role="group" aria-label="日にち">${days.slice().reverse().map((d) => html`<a class="fchip" href="#/staff/attendance?v=day&d=${d}" aria-pressed="${d === ds}">${Number(d.slice(5, 7))}/${Number(d.slice(8))}（${fmt.weekday(d + 'T12:00:00+09:00')}）${d === TODAY ? html`<span class="chip chip-live st-mini">きょう</span>` : ''}</a>`)}</div>
      <div class="stats st-stats st-stats3 st-noprint" style="--cols:3">
        <div class="stat"><span class="st-label">${ic('login')}来た人</span><span class="st-value">${came.length}<small>/ ${rows.filter((r) => !r.none).length}人</small></span><span class="st-sub">${fmt.dateShort(ds + 'T12:00:00+09:00')}</span></div>
        <div class="stat"><span class="st-label">${ic('house')}在宅</span><span class="st-value">${came.filter((r) => r.rec.home).length}<small>人</small></span><span class="st-sub">&nbsp;</span></div>
        <div class="stat"><span class="st-label">${ic('clock')}時間の合計</span><span class="st-value">${Math.round(total / 6) / 10}<small>時間</small></span><span class="st-sub">${ds === TODAY ? `${fmt.time(Clock.now())} 現在` : '&nbsp;'}</span></div>
      </div>
      <ul class="st-att-cards hide-pc st-noprint">${rows.map((r) => {
        if (r.none) return '';
        const [cls, label] = STATE_LABEL[r.state] || STATE_LABEL.left;
        const rec = r.rec;
        const ok = rec && !rec.absent;
        return html`<li class="card st-attc">
          <div class="st-attc-top">${av(r.u, 'sm')}<b class="grow">${r.u.name}</b><span class="status ${cls}">${label}</span>${rec && rec.edited ? html`<span class="chip st-mini">${ic('edit')}直した</span>` : ''}</div>
          ${ok ? html`<dl class="st-attc-dl"><div><dt>来た</dt><dd>${hm(rec.in)}</dd></div><div><dt>帰った</dt><dd>${rec.out != null ? hm(rec.out) : 'まだいる'}</dd></div><div><dt>休けい</dt><dd>${Math.round(rec.brk || 0)}分</dd></div><div><dt>取り組み</dt><dd><b>${fmt.dur(rec.work)}</b></dd></div></dl>`
            : html`<p class="small muted">${rec && rec.absent ? rec.reason : (r.state === 'notyet' ? `いつもは ${r.expected}ごろ` : '')}</p>`}
          <div class="st-attc-foot">${ok ? (rec.home ? html`<span class="chip">${ic('house')}在宅</span>` : html`<span class="chip">${ic('building')}通所</span>`) : html`<span></span>`}<button class="btn btn-sm btn-ghost" type="button" data-act="st-att-edit" data-id="${r.u.id}" data-d="${ds}" aria-label="${r.u.name}さんの出席を直す">${ic('edit')}<span>直す</span></button></div>
        </li>`;
      })}</ul>
      <h2 class="st-print-title">${K.FACILITY.name} 出席の記録 ${fmt.date(ds + 'T12:00:00+09:00')}</h2>
      <div class="table-wrap st-att-wrap"><table class="table st-att-table">
        <thead><tr><th>名前</th><th>様子</th><th class="num">来た</th><th class="num">帰った</th><th class="num">休けい</th><th class="num">取り組み</th><th>場所</th><th class="tight st-noprint"><span class="sr-only">直す</span></th></tr></thead>
        <tbody>${rows.map((r) => {
          if (r.none) return html`<tr class="st-tr-none"><td>${av(r.u, 'sm')}<span>${r.u.name}</span></td><td colspan="7" class="muted small">この日は利用前です</td></tr>`;
          const [cls, label] = STATE_LABEL[r.state] || STATE_LABEL.left;
          const rec = r.rec;
          return html`<tr>
            <td><span class="st-td-name">${av(r.u, 'sm')}<span>${r.u.name}</span></span></td>
            <td><span class="status ${cls}">${label}</span>${rec && rec.edited ? html`<span class="chip st-mini" title="${rec.edited.reason}">${ic('edit')}直した</span>` : ''}${rec && rec.absent ? html`<span class="xsmall muted st-reason">${rec.reason}</span>` : ''}${r.state === 'notyet' ? html`<span class="xsmall muted st-reason">いつもは ${r.expected}</span>` : ''}</td>
            <td class="num">${rec && !rec.absent ? hm(rec.in) : '—'}</td>
            <td class="num">${rec && !rec.absent && rec.out != null ? hm(rec.out) : (r.state === 'in' ? html`<span class="xsmall muted">まだいる</span>` : '—')}</td>
            <td class="num">${rec && !rec.absent ? `${Math.round(rec.brk || 0)}分` : '—'}</td>
            <td class="num"><b>${rec && !rec.absent ? fmt.dur(rec.work) : '—'}</b></td>
            <td>${rec && !rec.absent ? (rec.home ? html`<span class="chip">${ic('house')}在宅</span>` : html`<span class="chip">${ic('building')}通所</span>`) : '—'}</td>
            <td class="tight st-noprint"><button class="btn btn-sm btn-ghost" type="button" data-act="st-att-edit" data-id="${r.u.id}" data-d="${ds}" aria-label="${r.u.name}さんの出席を直す">${ic('edit')}<span>直す</span></button></td>
          </tr>`;
        })}</tbody>
      </table></div>
      <p class="xsmall muted">「直した」がついた記録は、直した理由が残ります（試作）。</p>`;
  }
  function monthView(days) {
    const list = S().mine;
    const cell = (u, d) => {
      if (u.isNew && d < u.since) return { mark: '', cls: 'st-mc-none', h: 0 };
      if (d === TODAY) {
        const r = dayRows(TODAY).find((x) => x.u.id === u.id);
        if (r.state === 'absent') return { mark: '休', cls: 'st-mc-abs', h: 0 };
        if (r.state === 'notyet') return { mark: '…', cls: 'st-mc-none', h: 0 };
        return { mark: r.rec.home ? '在' : '○', cls: 'st-mc-in', h: Math.round(r.rec.work / 6) / 10 };
      }
      const rec = applyEdit(u.id, d, (S().attendance[u.id] || {})[d]);
      if (!rec) return { mark: '', cls: 'st-mc-none', h: 0 };
      if (rec.absent) return { mark: '休', cls: 'st-mc-abs', h: 0 };
      return { mark: rec.home ? '在' : '○', cls: 'st-mc-in', h: Math.round(rec.work / 6) / 10 };
    };
    return html`
      <div class="cluster small st-noprint"><span class="st-mlegend"><b class="st-mc st-mc-in">○</b>通所</span><span class="st-mlegend"><b class="st-mc st-mc-in">在</b>在宅</span><span class="st-mlegend"><b class="st-mc st-mc-abs">休</b>休み</span><span class="st-mlegend"><b class="st-mc st-mc-none">…</b>まだ</span><span class="muted">数字は取り組んだ時間（時間）</span></div>
      <h2 class="st-print-title">${K.FACILITY.name} 出席の一覧 2026年10月</h2>
      <div class="table-wrap st-month"><table class="table st-month-table">
        <thead><tr><th class="st-sticky">名前</th>${days.map((d) => html`<th class="st-mday ${d === TODAY ? 'is-today' : ''}"><span>${Number(d.slice(8))}</span><small>${fmt.weekday(d + 'T12:00:00+09:00')}</small></th>`)}<th class="num">出席</th><th class="num">時間</th></tr></thead>
        <tbody>${list.map((u) => {
          const cs = days.map((d) => cell(u, d));
          const came = cs.filter((c) => c.cls === 'st-mc-in').length;
          const h = Math.round(sum(cs, (c) => c.h) * 10) / 10;
          return html`<tr><td class="st-sticky"><span class="st-td-name">${av(u, 'sm')}<span>${u.name}</span></span></td>${cs.map((c, i) => html`<td class="st-mcell ${days[i] === TODAY ? 'is-today' : ''}"><b class="st-mc ${c.cls}">${c.mark}</b>${c.h ? html`<small>${c.h}</small>` : ''}</td>`)}<td class="num"><b>${came}</b>日</td><td class="num"><b>${h}</b></td></tr>`;
        })}</tbody>
      </table></div>`;
  }
  act('st-print', () => window.print());
  act('st-csv', (el) => {
    const v = el.getAttribute('data-v');
    const days = OCT();
    let rows;
    if (v === 'month') {
      rows = [['名前'].concat(days.map((d) => d.slice(5))).concat(['出席日数', '合計時間'])];
      S().mine.forEach((u) => {
        const vals = days.map((d) => {
          if (d === TODAY) { const r = dayRows(TODAY).find((x) => x.u.id === u.id); return r.rec && !r.rec.absent ? (Math.round(r.rec.work / 6) / 10) : (r.state === 'absent' ? '休' : ''); }
          const rec = applyEdit(u.id, d, (S().attendance[u.id] || {})[d]);
          return !rec ? '' : rec.absent ? '休' : Math.round(rec.work / 6) / 10;
        });
        const nums = vals.filter((x) => typeof x === 'number');
        rows.push([u.name].concat(vals).concat([nums.length, Math.round(sum(nums) * 10) / 10]));
      });
    } else {
      const ds = el.getAttribute('data-d');
      rows = [['日にち', '名前', '様子', '来た', '帰った', '休けい（分）', '取り組み（分）', '場所', '直した理由']];
      dayRows(ds).forEach((r) => {
        if (r.none) return;
        const rec = r.rec;
        rows.push([ds, r.u.name, (STATE_LABEL[r.state] || STATE_LABEL.left)[1], rec && !rec.absent ? hm(rec.in) : '', rec && !rec.absent && rec.out != null ? hm(rec.out) : '', rec && !rec.absent ? Math.round(rec.brk || 0) : '', rec && !rec.absent ? Math.round(rec.work) : '', rec && !rec.absent ? (rec.home ? '在宅' : '通所') : '', rec && rec.edited ? rec.edited.reason : (rec && rec.absent ? rec.reason : '')]);
      });
    }
    const csv = rows.map((r) => r.map((x) => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    UI.download(v === 'month' ? `出席一覧_2026-10_${K.FACILITY.name}.csv` : `出席_${el.getAttribute('data-d')}_${K.FACILITY.name}.csv`, csv);
    UI.toast('CSVファイルを保存しました', { icon: 'download' });
  });
  act('st-att-edit', (el) => {
    const id = el.getAttribute('data-id'), ds = el.getAttribute('data-d');
    const u = person(id);
    const r = dayRows(ds).find((x) => x.u.id === id);
    const rec = r && r.rec && !r.rec.absent ? r.rec : null;
    const inV = rec ? hm(rec.in).padStart(5, '0') : u.inT;
    const outV = rec && rec.out != null ? hm(rec.out).padStart(5, '0') : u.outT;
    UI.sheet({
      title: `出席を直す：${u.name}さん`, icon: ic('edit'),
      body: html`<p class="small muted">${fmt.date(ds + 'T12:00:00+09:00')}の記録です。直した理由は記録に残ります。</p>
        <div class="seg seg-block" role="group" aria-label="出席か休みか"><button type="button" data-kind="in" aria-selected="${!(r && r.rec && r.rec.absent)}">出席</button><button type="button" data-kind="absent" aria-selected="${!!(r && r.rec && r.rec.absent)}">休み</button></div>
        <div class="st-edit-times grid-2" data-times>
          <div class="field"><label class="label" for="st-in">来た時間</label><input class="input" id="st-in" type="time" value="${inV}"></div>
          <div class="field"><label class="label" for="st-out">帰った時間</label><input class="input" id="st-out" type="time" value="${outV}"></div>
          <div class="field"><label class="label" for="st-brk">休けい（分）</label><input class="input" id="st-brk" type="number" min="0" step="5" value="${rec ? Math.round(rec.brk || 0) : 60}"></div>
          <div class="field"><span class="label">場所</span><div class="seg seg-block" role="group" aria-label="場所"><button type="button" data-home="0" aria-selected="${!(rec && rec.home)}">通所</button><button type="button" data-home="1" aria-selected="${!!(rec && rec.home)}">在宅</button></div></div>
        </div>
        <div class="field"><span class="label">直す理由<span class="opt">（かならず書く）</span></span>
          <div class="cluster">${['押しわすれ', '通院で途中から', '在宅に切りかえ', '時間のまちがい', '連絡のあった休み'].map((x) => html`<button class="fchip" type="button" aria-pressed="false" data-reason="${x}">${x}</button>`)}</div>
          <textarea class="textarea" id="st-reason" style="min-height:70px" placeholder="例：帰りの押しわすれ。本人と確認した"></textarea></div>`,
      foot: html`<button class="btn btn-lg" type="button" data-close>やめる</button><button class="btn btn-primary btn-lg" type="button" data-yes>${ic('check')}<span>保存する</span></button>`,
      mount: (sh, close) => {
        let kind = r && r.rec && r.rec.absent ? 'absent' : 'in';
        let home = !!(rec && rec.home);
        const times = sh.querySelector('[data-times]');
        const syncKind = () => { times.hidden = kind === 'absent'; sh.querySelectorAll('[data-kind]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.kind === kind))); };
        sh.querySelectorAll('[data-kind]').forEach((b) => b.addEventListener('click', () => { kind = b.dataset.kind; syncKind(); }));
        sh.querySelectorAll('[data-home]').forEach((b) => b.addEventListener('click', () => { home = b.dataset.home === '1'; sh.querySelectorAll('[data-home]').forEach((x) => x.setAttribute('aria-selected', String(x === b))); }));
        sh.querySelectorAll('[data-reason]').forEach((b) => b.addEventListener('click', () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on)); }));
        syncKind();
        sh.querySelector('[data-yes]').addEventListener('click', () => {
          const picked = Array.from(sh.querySelectorAll('[data-reason][aria-pressed="true"]')).map((x) => x.dataset.reason);
          const memo = sh.querySelector('#st-reason').value.trim();
          const reason = picked.concat(memo ? [memo] : []).join('。');
          if (!reason) { UI.toast('直す理由を えらぶか、書いてください', { icon: 'info' }); sh.querySelector('#st-reason').focus(); return; }
          const inT = sh.querySelector('#st-in').value || u.inT, outT = sh.querySelector('#st-out').value || u.outT;
          if (kind === 'in' && toMin(outT) <= toMin(inT)) { UI.toast('帰った時間は、来た時間より あとにしてください', { icon: 'info' }); return; }
          Store.update((s) => {
            s.attEdits = s.attEdits || {};
            s.attEdits[`${id}|${ds}`] = kind === 'absent' ? { absent: true, reason, by: STAFF_NAME, at: nowISO() } : { in: inT, out: outT, brk: Math.max(0, Number(sh.querySelector('#st-brk').value) || 0), home, reason, by: STAFF_NAME, at: nowISO() };
          });
          close();
          UI.toast(`${u.name}さんの出席を直しました`);
        });
      }
    });
  });

  /* ---------- 月の報告 ---------- */
  function monthStats(u) {
    const data = monthSeries(u);
    const came = data.filter((x) => x.a && !x.a.absent);
    const hours = sum(came, (x) => x.value);
    const r = Core.rng(Core.hashStr(u.id + 'm'));
    let subs, oks, watched;
    if (u.id === S().me) {
      const ts = Object.values(S().tasks);
      subs = ts.filter((t) => (t.submittedAt || '').startsWith('2026-10')).length;
      oks = ts.filter((t) => t.status === 'ok' && (t.okAt || '').startsWith('2026-10')).length;
      watched = Object.values(S().lessons).filter((v) => v >= 1).length;
    } else {
      subs = 1 + Math.floor(r() * 4) + (u.level === 'advanced' ? 1 : 0);
      oks = Math.max(0, subs - Math.floor(r() * 2));
      watched = 4 + Math.floor(r() * 12);
      if (u.isNew) { subs = 1; oks = 1; watched = 5; }
    }
    const live = Math.round(came.length * (0.9 + r() * 0.7));
    return { data, came: came.length, planned: data.filter((x) => !(u.isNew && x.ds < u.since)).length, hours, avg: came.length ? hours / came.length : 0, subs, oks, watched, live };
  }
  const SKILLS = {
    web: ['STUDIOでページの骨組みを作れる', '写真と説明をならべられる', '目次から見出しへ飛べるようにできる', '表と流れの図を作れる'],
    design: ['キャンバで文字と写真をならべられる', 'OGP画像の大きさで作れる', '色を3色くらいにまとめられる', 'チラシ1まいを仕上げられる'],
    video: ['素材をならべて、いらない所をカットできる', 'テロップを入れられる', 'BGMの音の大きさをそろえられる', '書き出して提出できる'],
    sns: ['投稿の文をAIといっしょに考えられる', '人の写真が入らないよう気をつけられる', 'ニュースの出どころを書ける'],
    ai: ['AIにお願いの文をわたせる', 'AIの文を自分の目で直せる'],
    esports: ['チームで声をかけあえる'], pc: ['マウスとキーボードの基本']
  };
  function skillsOf(u) {
    if (u.id === S().me) {
      const oks = Object.entries(S().tasks).filter(([, t]) => t.status === 'ok' && (t.okAt || '').startsWith('2026-10')).map(([id]) => taskOf(id)).filter(Boolean);
      const series = window.CATALOG.series.filter((s) => s.episodes.length && s.episodes.every((e) => (S().lessons[e.id] || 0) >= 1)).map((s) => `教材「${s.title}」を ぜんぶ見た`);
      return oks.map((t) => `${t.title}（運営の確認でOK）`).concat(series.slice(0, 3));
    }
    const lvN = { beginner: 1, middle: 2, advanced: 3 }[u.level] || 1;
    return u.genres.flatMap((g) => (SKILLS[g] || []).slice(0, lvN + (u.isNew ? 0 : 1))).slice(0, 4);
  }
  function opsWords(u) {
    const out = [];
    if (u.id === S().me) Object.values(S().chats).forEach((c) => c.filter((m) => m.from === 'ops').forEach((m) => out.push(m)));
    S().submissions.filter((x) => x.learner === u.id && x.reply && x.reply.text).forEach((x) => out.push({ at: x.decidedAt || x.at, text: x.reply.text, who: '運営' }));
    return out.sort(by('at', 'desc')).slice(0, 2);
  }
  function pageReport() {
    const list = S().mine.map((u) => ({ u, m: monthStats(u), rep: (S().reports || {})[u.id] }));
    const totalDays = sum(list, (x) => x.m.came);
    const totalH = sum(list, (x) => x.m.hours);
    const subs = sum(list, (x) => x.m.subs), oks = sum(list, (x) => x.m.oks);
    const live = sum(list, (x) => x.m.live);
    const daily = OCT().map((ds) => ({ label: `${Number(ds.slice(8))}日`, short: String(Number(ds.slice(8))), value: list.filter((x) => { const d = x.m.data.find((y) => y.ds === ds); return d && d.a && !d.a.absent; }).length }));
    const doneN = list.filter((x) => x.rep && x.rep.status === 'done').length;
    return {
      title: '月の報告', nav: 'report', wide: true,
      html: html`<div class="page">
        <div class="page-head"><div class="ph-text"><span class="eyebrow">2026年10月（26日までの記録）</span><h1>月の報告</h1><p class="lead">一人ひとりの10月の取り組みを まとめます。AIの下書きを使って、書く時間を へらせます。</p></div></div>
        <div class="banner warn">${ic('info')}<span class="b-text">この報告は、ふりかえりの材料です。<p>福祉サービスの支援記録は、事業所の様式で残してください。</p></span></div>
        <div class="stats st-stats st-stats5">
          ${stat('calcheck', 'のべ出席', totalDays, '日', `${list.length}人の合計`, '')}
          ${stat('clock', '平均の時間', totalDays ? (totalH / totalDays).toFixed(1) : 0, '時間', '1日あたり', '')}
          ${stat('live', '授業LIVE', live, '回', 'のべ回数', '')}
          ${stat('send', '提出', subs, '件', '', '')}
          ${stat('checkc', '運営OK', oks, '件', subs ? `提出の${Math.round(oks / subs * 100)}%` : '', '')}
        </div>
        <section class="card card-pad sec"><div class="sec-head"><h2>${ic('chart')}10月の 1日ごとの来た人数</h2></div>
          ${Charts.bars(daily, { title: `${K.FACILITY.name}の 10月の1日ごとの来た人数（人）`, unit: '人', xName: '日にち', yName: '人数', fmt: (v) => String(Math.round(v)) })}
        </section>
        <section class="sec"><div class="sec-head"><h2>${ic('users')}一人ひとりの報告</h2><span class="small muted">できた ${doneN} / ${list.length}人</span></div>
          <div class="card"><ul class="rows">${list.map(({ u, m, rep }) => html`<li><a class="row-item st-rep-row" href="#/staff/report/${u.id}">
            ${av(u)}
            <span class="st-rep-main"><span class="ri-title">${u.name}</span><span class="ri-sub">${u.genres.map((g) => K.GENRES[g].name).join('・')}</span></span>
            <span class="st-rep-nums"><span><b>${m.came}</b>日</span><span><b>${Math.round(m.hours)}</b>時間</span><span>提出 <b>${m.subs}</b> ・ OK <b>${m.oks}</b></span></span>
            <span class="ri-end">${rep && rep.status === 'done' ? html`<span class="chip chip-ok">${ic('check')}できた</span>` : rep ? html`<span class="chip chip-warn">${ic('edit')}下書き</span>` : html`<span class="chip">まだ</span>`}${ic('right')}</span>
          </a></li>`)}</ul></div></section>
      </div>`,
      mount: (root) => Charts.mount(root)
    };
  }

  function draftTexts(u, m) {
    const nm = first(u);
    const okList = u.id === S().me ? skillsOf(u).filter((x) => x.includes('（運営の確認でOK）')).map((x) => x.replace('（運営の確認でOK）', '')).slice(0, 2) : [];
    const genres = u.genres.map((g) => K.GENRES[g].name).join('と');
    const st = dayState(u);
    const topics = topicsOf(u).map(([k]) => k).slice(0, 2);
    const a = `${nm}さんは、10月に${m.came}日来所し、合計で約${Math.round(m.hours)}時間 取り組みました（1日の平均 約${m.avg.toFixed(1)}時間）。`
      + `${genres}の課題に取り組み、${m.subs}件を提出、${m.oks}件が運営の確認でOKになりました。`
      + (okList.length ? `とくに課題${okList.map((x) => `『${x}』`).join('と')}を最後まで仕上げられたのは、大きな一歩です。` : '')
      + (topics.length ? `わからない時は、ぴくとに「${topics.join('」「')}」などを自分から聞けています。` : '')
      + (st.mood === 'つかれぎみ' ? '月の後半は つかれが見える日もあり、休けいの声かけをしています。' : '');
    const lvNext = { beginner: '中級', middle: '上級', advanced: '上級の案件' }[u.level] || '中級';
    const b = u.id === S().me
      ? 'ブログ記事の中級（STUDIO版）を仕上げて、上級の「表と流れの図」にチャレンジする。わからない所は、ぴくとや職員に早めに聞く。'
      : `${K.GENRES[u.genres[0]].name}の${lvNext}の課題を1つ出す。${u.goal}。こまった時は、早めに声をかける。`;
    return [a, b];
  }
  function pageReportOne(route) {
    const u = S().mine.find((x) => x.id === route.params.id);
    if (!u) return { title: '月の報告', html: html`<div class="empty card">見つかりませんでした</div>` };
    const m = monthStats(u);
    const rep = (S().reports || {})[u.id] || {};
    const skills = skillsOf(u);
    const words = opsWords(u);
    return {
      title: `${u.name}さんの10月の報告`, topTitle: '月の報告', nav: 'report', back: '#/staff/report', wide: true,
      html: html`<div class="page st-report">
        <div class="page-head"><div class="ph-text"><span class="eyebrow">2026年10月の報告 ・ ${K.FACILITY.name}</span><h1>${u.name}さん</h1><p class="lead">10月1日〜10月26日の記録から作っています。</p></div>
          <div class="ph-actions st-noprint">${rep.status ? html`<span class="chip ${rep.status === 'done' ? 'chip-ok' : 'chip-warn'}">${rep.status === 'done' ? 'できた' : '下書き'}${rep.savedAt ? ` ・ ${fmt.dt(rep.savedAt)}` : ''}</span>` : ''}<button class="btn" type="button" data-act="st-print">${ic('printer')}<span>印刷</span></button></div></div>
        <div class="banner warn st-noprint">${ic('info')}<span class="b-text">この報告は、ふりかえりの材料です。<p>福祉サービスの支援記録は、事業所の様式で残してください。</p></span></div>
        <div class="stats st-stats">
          ${stat('calcheck', '来た日', m.came, `/ ${m.planned}日`, '', '')}
          ${stat('clock', '取り組んだ時間', Math.round(m.hours), '時間', `平均 ${m.avg.toFixed(1)}時間/日`, '')}
          ${stat('send', '提出', m.subs, '件', '', '')}
          ${stat('checkc', '運営OK', m.oks, '件', '', '')}
          ${stat('book', '見た教材', m.watched, '本', '', '')}
          ${stat('live', '授業LIVE', m.live, '回', '参加', '')}
        </div>
        <div class="grid-2 st-rep-grid">
          <section class="card card-pad sec"><div class="sec-head"><h2>${ic('calendar')}出席のカレンダー</h2></div>${calendar(u, m.data)}</section>
          <section class="card card-pad sec"><div class="sec-head"><h2>${ic('chart')}1日ごとの取り組んだ時間</h2></div>
            ${Charts.bars(m.data.map((x) => ({ label: x.label, short: x.short, value: x.value })), { title: `${u.name}さんの 10月の1日ごとの取り組んだ時間（時間）`, unit: '時間', xName: '日にち', yName: '時間', fmt: (v) => String(Math.round(v * 10) / 10), height: 200 })}</section>
        </div>
        <div class="grid-2 st-rep-grid">
          <section class="card card-pad sec"><div class="sec-head"><h2>${ic('sprout')}できるようになったこと</h2></div>
            ${skills.length ? html`<ul class="st-skills">${skills.map((x) => html`<li>${ic('checkc')}<span>${x}</span></li>`)}</ul>` : html`<p class="muted small">まだ ありません</p>`}</section>
          <section class="card card-pad sec"><div class="sec-head"><h2>${ic('chat')}運営からのことば</h2></div>
            ${words.length ? html`<div class="stack">${words.map((w) => html`<blockquote class="st-quote"><p>${w.text.split('\n').filter(Boolean).slice(0, 3).join(' ')}</p><span class="xsmall muted">${fmt.date(w.at)} ・ ${w.who || '運営'}</span></blockquote>`)}</div>` : html`<p class="muted small">今月は まだ ありません</p>`}</section>
        </div>
        <section class="card card-pad sec st-writing">
          <div class="sec-head"><h2>${ic('edit')}職員が書くところ</h2><button class="btn btn-soft st-noprint" type="button" data-act="st-draft" data-id="${u.id}">${ic('sparkles')}<span>下書きを作る（AI）</span></button></div>
          <p class="xsmall muted st-noprint">AIの下書きは、記録から自動で作った文です。かならず読んで、直してから使ってください。</p>
          <div class="field"><label class="label" for="st-r1">本人のようす</label><textarea class="textarea" id="st-r1" style="min-height:150px" placeholder="10月の取り組みのようすを書きます">${rep.text1 || ''}</textarea></div>
          <div class="field"><label class="label" for="st-r2">来月の目標</label><textarea class="textarea" id="st-r2" style="min-height:90px" placeholder="本人と話して決めた目標を書きます">${rep.text2 || ''}</textarea></div>
          <div class="row st-noprint" style="flex-wrap:wrap;justify-content:flex-end"><button class="btn" type="button" data-act="st-rep-save" data-id="${u.id}" data-st="draft">${ic('note')}<span>下書きとして保存</span></button><button class="btn btn-primary" type="button" data-act="st-rep-save" data-id="${u.id}" data-st="done">${ic('check')}<span>できた（保存）</span></button></div>
        </section>
        <p class="xsmall muted st-print-foot">${K.FACILITY.name}（架空） ・ 記入：${STAFF_NAME} ・ エスピクトスクールの記録から作成</p>
      </div>`,
      mount: (root) => Charts.mount(root)
    };
  }
  act('st-draft', (el) => {
    const u = S().mine.find((x) => x.id === el.getAttribute('data-id'));
    const [a, b] = draftTexts(u, monthStats(u));
    const t1 = document.getElementById('st-r1'), t2 = document.getElementById('st-r2');
    if ((t1.value.trim() || t2.value.trim()) && !confirm('書いてある文を、下書きで おきかえますか？')) return;
    el.disabled = true;
    const typeIn = (ta, text, done) => {
      if (Clock.frozen || document.documentElement.dataset.motion === 'reduce') { ta.value = text; done(); return; }
      let i = 0; ta.value = '';
      const tm = setInterval(() => { i += 3; ta.value = text.slice(0, i); if (i >= text.length) { clearInterval(tm); done(); } }, 16);
    };
    typeIn(t1, a, () => typeIn(t2, b, () => { el.disabled = false; UI.toast('下書きを作りました。読んで直してから保存してください', { icon: 'sparkles' }); }));
  });
  act('st-rep-save', (el) => {
    const id = el.getAttribute('data-id');
    const st = el.getAttribute('data-st');
    const t1 = document.getElementById('st-r1').value, t2 = document.getElementById('st-r2').value;
    if (st === 'done' && (!t1.trim() || !t2.trim())) { UI.toast('「本人のようす」と「来月の目標」を書いてください', { icon: 'info' }); return; }
    Store.update((s) => { s.reports = s.reports || {}; s.reports[id] = { status: st, text1: t1, text2: t2, savedAt: nowISO(), by: STAFF_NAME }; });
    UI.toast(st === 'done' ? '報告を保存しました（できた）' : '下書きを保存しました');
  });

  /* ---------- 授業の予定 ---------- */
  const NOTES = [
    { date: '2026-10-30', icon: 'star', title: '金曜日の5時間目は「画像デザイン」', sub: 'ハロウィンのバナーを作る回です（あんどう先生）' },
    { date: '2026-11-02', icon: 'bell', title: '11月の課題が とどきます', sub: '運営からのお知らせ。朝9時ごろに配信されます' },
    { date: '2026-11-03', icon: 'calendar', title: '文化の日（祝日）は 授業LIVEがお休み', sub: 'アーカイブと教材は いつもどおり見られます' },
    { date: '2026-11-06', icon: 'users', title: '事業所向けの説明会（オンライン・30分）', sub: '月の報告の使い方について（架空）' }
  ];
  function pageSchedule(route) {
    const now = Clock.now();
    const wd = jst(now).wd;
    const sel = Number(route.query.day || wd) || 1;
    const days = ['', '月', '火', '水', '木', '金'];
    const ls = window.LearnerKit ? window.LearnerKit.liveState() : { current: null };
    const sts = allStates();
    const likely = (g) => sts.filter((x) => x.u.genres.includes(g) && x.status !== 'absent');
    const cell = (d, p) => {
      const g = (K.TIMETABLE[d] || {})[p.key];
      if (p.rest) return html`<span class="st-tt-rest">お昼休み</span>`;
      if (!g) return '';
      const G = K.GENRES[g];
      const isNow = d === wd && ls.current && ls.current.key === p.key;
      const done = d === wd && now >= Clock.at(p.end);
      return html`<div class="st-tt-cell ${isNow ? 'is-now' : ''} ${done ? 'is-done' : ''}">${gm(g, true)}<span><b>${G.name}</b><span class="xsmall muted">${K.TEACHERS[g]}</span></span>${isNow ? html`<span class="chip chip-live st-mini">いま</span>` : ''}</div>`;
    };
    return {
      title: '授業の予定', nav: 'schedule', wide: true,
      html: html`<div class="page">
        <div class="page-head"><div class="ph-text"><h1>授業の予定</h1><p class="lead">授業LIVEは 平日10:10から。利用者は、自分のジャンルの授業に参加します。</p></div></div>
        <section class="card st-tt hide-sp" aria-label="1週間の時間割">
          <table class="st-tt-table"><thead><tr><th></th>${[1, 2, 3, 4, 5].map((d) => html`<th class="${d === wd ? 'is-today' : ''}">${days[d]}${d === wd ? html`<span class="chip chip-live st-mini">きょう</span>` : ''}</th>`)}</tr></thead>
            <tbody>${K.PERIODS.map((p) => p.rest ? html`<tr class="is-rest"><th scope="row"><b>${p.name}</b><span class="xsmall muted">${p.start}〜${p.end}</span></th><td colspan="5"><span class="st-tt-rest">${ic('coffee')}お昼休み（授業LIVEは ありません）</span></td></tr>` : html`<tr><th scope="row"><b>${p.name}</b><span class="xsmall muted">${p.start}〜${p.end}</span></th>${[1, 2, 3, 4, 5].map((d) => html`<td class="${d === wd ? 'is-today' : ''}">${cell(d, p)}</td>`)}</tr>`)}</tbody></table>
        </section>
        <section class="sec hide-pc"><div class="seg" role="tablist" aria-label="曜日">${[1, 2, 3, 4, 5].map((d) => html`<a role="tab" href="#/staff/schedule?day=${d}" aria-selected="${d === sel}">${days[d]}${d === wd ? html`<span class="chip chip-live st-mini">きょう</span>` : ''}</a>`)}</div>
          <div class="card"><div class="rows">${K.PERIODS.map((p) => html`<div class="row-item st-tt-row ${p.rest ? 'is-rest' : ''}"><span class="tt-time">${p.start}<small>〜${p.end}</small></span><span class="grow">${p.rest ? html`<span class="muted">お昼休み</span>` : cell(sel, p)}</span><span></span></div>`)}</div></div></section>
        <div class="grid-2">
          <section class="card card-pad sec"><div class="sec-head"><h2>${ic('users')}きょう参加しそうな人</h2><span class="small muted">${fmt.date(now)}</span></div>
            <ul class="st-likely">${K.PERIODS.filter((p) => !p.rest && (K.TIMETABLE[wd] || {})[p.key]).map((p) => { const g = K.TIMETABLE[wd][p.key]; const ppl = likely(g); return html`<li>
              <div class="st-lk-head">${gm(g, true)}<span class="grow"><b>${p.name} ${K.GENRES[g].name}</b><span class="xsmall muted">${p.start}〜${p.end} ・ ${K.TEACHERS[g]}</span></span><span class="chip">${ppl.length}人</span></div>
              ${ppl.length ? html`<div class="st-avs">${ppl.map((x) => html`<a class="st-av-chip" href="#/staff/person/${x.u.id}" title="${x.u.name}">${av(x.u, 'sm')}<span>${first(x.u)}</span></a>`)}</div>` : html`<p class="xsmall muted">いません</p>`}
            </li>`; })}</ul></section>
          <section class="card card-pad sec"><div class="sec-head"><h2>${ic('bell')}これからの お知らせ</h2></div>
            <ul class="st-notes">${NOTES.map((n) => html`<li><span class="st-n-date"><b>${Number(n.date.slice(5, 7))}/${Number(n.date.slice(8))}</b><span>${fmt.weekday(n.date + 'T12:00:00+09:00')}</span></span><span class="grow"><b class="row" style="gap:6px">${ic(n.icon)}${n.title}</b><span class="small muted">${n.sub}</span></span></li>`)}</ul>
            <p class="xsmall muted">お知らせの中身は試作のための架空のものです。</p></section>
        </div>
      </div>`
    };
  }

  /* ---------- 見やすさ・設定 ---------- */
  function pageSettings() {
    const st = S().settings.staff;
    const sw = (key, label, sub, iconName) => html`<label class="row-item set-row"><span class="ico-badge sm">${ic(iconName)}</span><span><span class="ri-title">${label}</span><span class="ri-sub">${sub}</span></span><span class="switch"><input type="checkbox" ${st[key] ? 'checked' : ''} data-change="st-set" data-key="${key}" aria-label="${label}"><span class="sw-track"></span></span></label>`;
    return {
      title: '見やすさ・設定', nav: 'settings',
      html: html`<div class="page settings">
        <div class="page-head"><div class="ph-text"><h1>見やすさ・設定</h1><p class="lead">職員の画面の見え方です。利用者の画面とは べつに保存されます。</p></div></div>
        <section class="sec"><div class="sec-head"><h2>${ic('textsize')}文字の大きさ</h2></div>
          <div class="choice-grid fs-choice" style="--cols:3">${[[1, 'ふつう'], [2, '大きい'], [3, 'とても大きい']].map(([v, n]) => html`<button class="choice" type="button" data-act="st-set-fs" data-v="${v}" aria-pressed="${st.fs === v}"><span class="fs-a fs-a${v}">あ</span><span>${n}</span></button>`)}</div></section>
        <section class="sec"><div class="sec-head"><h2>${ic('sun')}画面の色</h2></div>
          <div class="choice-grid" style="--cols:2">${[['light', '明るい', 'sun'], ['dark', 'ダーク（暗い）', 'moon']].map(([v, n, i]) => html`<button class="choice theme-${v}" type="button" data-act="st-set-theme" data-v="${v}" aria-pressed="${st.theme === v}">${ic(i, { size: 28 })}<span>${n}</span></button>`)}</div></section>
        <section class="sec"><div class="sec-head"><h2>${ic('eye')}読みやすさ</h2></div>
          <div class="card rows">${sw('contrast', 'くっきり表示', '文字と線を こく、太くします', 'contrast')}${sw('reduceMotion', '動きを へらす', '画面の動きを 少なくします', 'wave')}</div></section>
        <section class="sec"><div class="sec-head"><h2>${ic('info')}試作について</h2></div>
          <div class="card rows">
            <button class="row-item" type="button" data-act="reset"><span class="ico-badge sm warn">${ic('refresh')}</span><span><span class="ri-title">データを最初にもどす</span><span class="ri-sub">利用者・職員・運営で押したり出したりしたことが、もとにもどります</span></span><span class="chev">${ic('right')}</span></button>
            <a class="row-item" href="index.html#/"><span class="ico-badge sm">${ic('back')}</span><span><span class="ri-title">入口にもどる</span><span class="ri-sub">利用者・運営の画面も見られます</span></span><span class="chev">${ic('right')}</span></a>
          </div></section>
      </div>`
    };
  }
  act('st-set', (el) => { const k = el.getAttribute('data-key'); Store.update((s) => { s.settings.staff[k] = el.checked; }); });
  act('st-set-fs', (el) => { Store.update((s) => { s.settings.staff.fs = Number(el.getAttribute('data-v')); }); });
  act('st-set-theme', (el) => { Store.update((s) => { s.settings.staff.theme = el.getAttribute('data-v'); }); });

  /* ---------- 時計 ---------- */
  let lastMin = null;
  document.addEventListener('tick', () => {
    if (!App.current || App.current.role !== 'staff') return;
    Core.$$('[data-st-clock]').forEach((el) => { el.textContent = fmt.time(Clock.now()); });
    const m = Clock.minutes();
    if (lastMin != null && m !== lastMin && (App.current.parts[0] || 'today') === 'today') App.refresh();
    lastMin = m;
  });

  App.register('staff', {
    routes: {
      'today': pageToday,
      'people': pagePeople,
      'person/:id': pagePerson,
      'attendance': pageAttendance,
      'report': pageReport,
      'report/:id': pageReportOne,
      'schedule': pageSchedule,
      'settings': pageSettings
    },
    shell,
    home: 'today'
  });
  Store.on(() => { if (App.current && App.current.role === 'staff') App.refresh(); });
  window.StaffKit = { dayState };
})();

</script>
<script>/* js/admin.js */
/* =========================================================
   運営（エスピクトスクール運営）の画面
   ホーム・提出チェック・配信・案件ボード・納品・利用者・事業所・設定
   ========================================================= */
(function () {
  'use strict';
  const { html, raw, ic, esc, fmt, jst, sum, groupBy } = Core;
  const K = window.CONTENT;
  const C = window.CATALOG;
  const S = () => Store.state;
  const nowISO = () => Clock.now().toISOString();
  const B = (v) => (v ? 'true' : 'false');
  const T = (x) => new Date(x).getTime();
  const today = () => jst(Clock.now()).date;

  /* ---------- 共通の小物 ---------- */
  const A = {};
  A.person = (id) => S().mine.find((u) => u.id === id) || S().others.find((u) => u.id === id) || { id, name: '（見つかりません）', color: '#566b7d', genres: [], level: 'beginner', facility: '' };
  A.fac = (id) => S().facilities.find((f) => f.id === id) || { id, name: '—', area: '' };
  A.task = (id) => K.ALL_TASKS.find((t) => t.id === id) || S().extraTasks.find((t) => t.id === id) || null;
  A.av = (u, cls) => html`<span class="av ${cls || ''}" style="--av:${u.color || '#0094c8'}" aria-hidden="true">${(u.name || '?')[0]}</span>`;
  A.lv = (lv) => (lv && K.LEVELS[lv] ? html`<span class="chip ${K.LEVELS[lv].cls}">${K.LEVELS[lv].name}</span>` : '');
  A.gmark = (g, sm) => { const G = K.GENRES[g] || K.GENRES.pc; return html`<span class="gmark ${sm ? 'sm' : ''} ${G.cls}" aria-hidden="true">${ic(G.icon)}</span>`; };
  A.VERDICT = {
    good: { label: 'よさそう', cls: 'chip-ok', icon: 'checkc', long: 'よさそうです' },
    fix: { label: '直す所あり', cls: 'chip-warn', icon: 'edit', long: '直す所がありそうです' },
    check: { label: '人の目で確認', cls: 'chip-info', icon: 'eye', long: '人の目で確かめてください' }
  };
  A.vchip = (v) => { const x = A.VERDICT[v] || A.VERDICT.check; return html`<span class="chip ${x.cls}">${ic(x.icon)}${x.label}</span>`; };
  A.waiting = () => S().submissions.filter((x) => x.status === 'waiting');
  A.hash = (s) => Core.hashStr(String(s));
  A.subsOf = (u) => (u.subs != null ? u.subs : 3 + (A.hash(u.id) % 11));
  A.okRateOf = (u) => (u.okRate != null ? u.okRate : 74 + (A.hash(u.id + 'ok') % 22));
  A.kindIcon = { url: 'link', image: 'image', video: 'film', text: 'file' };
  A.kindName = { url: 'URL', image: '画像', video: '動画', text: '文' };

  /* ---------- やさしい日本語チェック ---------- */
  function suru(word, te, masu, ru, stem, noun) {
    return { word, sugg: ru, re: new RegExp(word + '(してください|しました|します|して|する|し|)', 'g'),
      rep: (m, suf) => ({ 'してください': te + 'ください', 'しました': masu.replace(/ます$/, 'ました'), 'します': masu, 'して': te, 'する': ru, 'し': stem, '': noun })[suf] };
  }
  function noun(word, sugg, to) { return { word, sugg, re: new RegExp(word, 'g'), rep: () => (to != null ? to : sugg) }; }
  const EASY = [
    suru('修正', '直して', '直します', '直す', '直し', '直し'),
    suru('確認', '確かめて', '確かめます', '確かめる', '確かめ', '確かめること'),
    suru('改善', 'よくして', 'よくします', 'よくする', 'よくし', 'よくすること'),
    suru('実施', 'して', 'します', 'する', 'し', 'すること'),
    suru('調整', 'ととのえて', 'ととのえます', 'ととのえる', 'ととのえ', 'ととのえること'),
    suru('削除', 'けして', 'けします', 'けす', 'けし', 'けすこと'),
    suru('追加', 'たして', 'たします', 'たす', 'たし', 'たすこと'),
    suru('変更', 'かえて', 'かえます', 'かえる', 'かえ', 'かえること'),
    suru('統一', 'そろえて', 'そろえます', 'そろえる', 'そろえ', 'そろえること'),
    suru('把握', '分かって', '分かります', '分かる', '分かり', '分かること'),
    suru('留意', '気をつけて', '気をつけます', '気をつける', '気をつけ', '気をつけること'),
    suru('推奨', 'おすすめして', 'おすすめします', 'おすすめする', 'おすすめし', 'おすすめ'),
    noun('可読性', '読みやすさ'), noun('視認性', '見やすさ'), noun('余白', 'すき間'), noun('不備', '足りない所'),
    noun('誤字', '字のまちがい'), noun('適切な', 'ちょうどいい'), noun('適切', 'ちょうどいい'), noun('提出物', '出したもの'),
    noun('必須', 'かならず'), noun('即座に', 'すぐに'), noun('困難', 'むずかしい'), noun('再提出', 'もう一度出すこと'),
    noun('配置', '置き方'), noun('構成', '組み立て'), noun('弊社', '（使わない）', '')
  ];
  const JUDGE = ['不合格', '合格', '失格', '点数', '採点', '何点'];
  function easyCheck(text) {
    const t = String(text || '');
    const out = [];
    EASY.forEach((r, i) => {
      const m = t.match(new RegExp(r.word, 'g'));
      if (m && !(r.word === '適切' && /適切な/.test(t) && (t.match(/適切/g) || []).length === (t.match(/適切な/g) || []).length)) out.push({ type: 'hard', i, word: r.word, sugg: r.sugg, count: m.length });
    });
    JUDGE.forEach((w) => {
      const n = (t.match(new RegExp(w, 'g')) || []).length - (w === '合格' ? (t.match(/不合格/g) || []).length : 0);
      if (n > 0) out.push({ type: 'judge', word: w, count: n });
    });
    t.split(/(?<=[。！？!?\n])/).forEach((sen) => {
      const s = sen.replace(/\n/g, '').trim();
      if (s.length > 58) out.push({ type: 'long', word: s.slice(0, 12), len: s.length });
    });
    return out;
  }
  function easyApply(text, i) { const r = EASY[i]; return String(text).replace(r.re, r.rep); }
  function easyPanel(text, scope) {
    const issues = easyCheck(text);
    const sc = scope || 'draft';
    if (!issues.length) return html`<div class="ad-easy is-ok"><div class="ad-easy-head">${ic('textsize')}<b>やさしい日本語チェック</b><span class="chip chip-ok">${ic('check')}だいじょうぶ</span></div><p class="xsmall muted">むずかしい言葉・合否のことば・長すぎる文は ありません。</p></div>`;
    return html`<div class="ad-easy"><div class="ad-easy-head">${ic('textsize')}<b>やさしい日本語チェック</b><span class="chip chip-warn">${issues.length}こ</span></div>
      <ul class="ad-easy-list">${issues.map((x) => {
        if (x.type === 'hard') return html`<li><span class="ad-easy-w">「${x.word}」</span><span class="ad-easy-arrow">${ic('next')}</span><b>${x.sugg}</b>${x.count > 1 ? html`<span class="xsmall muted">${x.count}か所</span>` : ''}<span class="grow"></span><button class="btn btn-sm btn-soft" type="button" data-act="ad-easy-rep" data-i="${x.i}" data-scope="${sc}">置きかえる</button></li>`;
        if (x.type === 'judge') return html`<li class="is-judge"><span class="ad-easy-w">「${x.word}」</span><span class="small">合否のことばは使いません</span><span class="grow"></span><button class="btn btn-sm btn-ghost" type="button" data-act="ad-easy-find" data-w="${x.word}" data-scope="${sc}">場所を見る</button></li>`;
        return html`<li class="is-long"><span class="ad-easy-w">長い文（${x.len}文字）</span><span class="small">2つに分けると読みやすくなります</span><span class="grow"></span><button class="btn btn-sm btn-ghost" type="button" data-act="ad-easy-find" data-w="${x.word}" data-scope="${sc}">場所を見る</button></li>`;
      })}</ul></div>`;
  }
  A.easyCheck = easyCheck;

  /* ---------- 骨組み ---------- */
  const NAV = [
    { group: '毎日の仕事' },
    { key: 'home', label: 'ホーム', short: 'ホーム', icon: 'grid', go: '#/admin/home' },
    { key: 'review', label: '提出チェック', short: '提出', icon: 'inbox', go: '#/admin/review', badge: () => A.waiting().length },
    { group: 'とどける' },
    { key: 'deliver', label: '配信', short: '配信', icon: 'layers', go: '#/admin/deliver' },
    { key: 'jobs', label: '案件ボード', short: '案件', icon: 'briefcase', go: '#/admin/jobs' },
    { key: 'delivery', label: '納品', short: '納品', icon: 'package', go: '#/admin/delivery' },
    { group: '管理' },
    { key: 'users', label: '利用者', short: '利用者', icon: 'users', go: '#/admin/users' },
    { key: 'facilities', label: '事業所', short: '事業所', icon: 'building', go: '#/admin/facilities' },
    { key: 'settings', label: '設定', short: '設定', icon: 'sliders', go: '#/admin/settings' }
  ];
  const TABS = [
    { key: 'home', label: 'ホーム', icon: 'grid', go: '#/admin/home' },
    { key: 'review', label: '提出チェック', icon: 'inbox', go: '#/admin/review', badge: () => A.waiting().length },
    { key: 'deliver', label: '配信', icon: 'layers', go: '#/admin/deliver' },
    { key: 'jobs', label: '案件', icon: 'briefcase', go: '#/admin/jobs' }
  ];
  const MORE = [
    { key: 'users', label: '利用者', icon: 'users', go: '#/admin/users' },
    { key: 'facilities', label: '事業所', icon: 'building', go: '#/admin/facilities' },
    { key: 'delivery', label: '納品', icon: 'package', go: '#/admin/delivery' },
    { key: 'settings', label: '設定', icon: 'sliders', go: '#/admin/settings' }
  ];

  function shell(route, page) {
    const cur = page.nav || route.parts[0] || 'review';
    const w = A.waiting().length;
    const moreActive = MORE.some((m) => m.key === cur);
    const back = page.back ? html`<a class="icon-btn tb-back ${page.backSpOnly ? 'hide-pc' : ''}" href="${page.back}" aria-label="もどる">${ic('back')}</a>` : '';
    return html`
      <a class="skip-link" href="#main">本文へ</a>
      <div class="app ad-app">
        <aside class="side ad-side" aria-label="運営のメニュー">
          <div class="side-brand">${raw(Icons.logoMark(38))}<div class="brand-text"><div class="wordmark">エスピクトスクール</div><div class="ad-role-tag">${ic('shieldcheck')}運営</div></div></div>
          <nav class="side-nav">
            ${NAV.map((it) => it.group ? html`<div class="nav-group">${it.group}</div>` : html`<a class="nav-item" href="${it.go}" ${cur === it.key ? raw('aria-current="page"') : ''}>${ic(it.icon)}<span class="ad-nav-long">${it.label}</span><span class="ad-nav-short">${it.short}</span>${it.badge && it.badge() ? html`<span class="count nav-badge">${it.badge()}</span>` : ''}</a>`)}
          </nav>
          <div class="side-foot">
            <a class="ad-side-user" href="#/admin/settings">${A.av({ name: K.OPS.name, color: '#22c3f0' }, 'sm')}<span class="hide-rail grow"><b>${K.OPS.name}</b><span class="xsmall">${K.OPS.team}</span></span></a>
            <a class="ad-side-exit hide-rail" href="#/">${ic('back')}<span>入口にもどる（試作）</span></a>
          </div>
        </aside>
        <div class="main-col">
          <header class="topbar ad-topbar">
            ${back}
            <span class="hide-pc">${raw(Icons.logoMark(28))}</span>
            <span class="tb-title">${page.topTitle || page.title}</span>
            <span class="hide-sp ad-tb-date">${ic('calendar')}<span>${fmt.date(Clock.now())}</span><b data-clock>${fmt.time(Clock.now())}</b></span>
            <span class="tb-spacer"></span>
            <a class="ad-tb-wait hide-sp ${w ? '' : 'is-zero'}" href="#/admin/review">${ic('inbox')}<span>確認待ち</span><b>${w}</b></a>
            <button class="icon-btn hide-pc" type="button" data-act="ad-more" aria-label="メニュー">${ic('menu')}</button>
          </header>
          <main id="main" class="main" tabindex="-1"></main>
        </div>
        ${page.hideTabbar ? '' : html`<nav class="tabbar ad-tabbar" aria-label="運営のメインメニュー">
          ${TABS.map((it) => html`<a class="tab" href="${it.go}" ${cur === it.key ? raw('aria-current="page"') : ''}><span class="tab-ico">${ic(it.icon)}</span><span>${it.label}</span>${it.badge && it.badge() ? html`<span class="count tab-badge">${it.badge()}</span>` : ''}</a>`)}
          <button class="tab" type="button" data-act="ad-more" ${moreActive ? raw('aria-current="page"') : ''}><span class="tab-ico">${ic('more')}</span><span>もっと</span></button>
        </nav>`}
      </div>`;
  }
  act('ad-more', () => {
    UI.sheet({
      title: 'メニュー',
      body: html`<div class="ad-menu">${MORE.map((m) => html`<a class="ad-menu-item" href="${m.go}" data-close><span class="ico-badge">${ic(m.icon)}</span><span>${m.label}</span></a>`)}</div>
        <a class="btn btn-ghost btn-block" href="#/" data-close>${ic('back')}<span>入口にもどる（試作）</span></a>`
    });
  });

  /* ---------- ホーム ---------- */
  const DAILY = [['10-13', 31], ['10-14', 28], ['10-15', 34], ['10-16', 30], ['10-17', 6], ['10-18', 4], ['10-19', 29], ['10-20', 33], ['10-21', 38], ['10-22', 36], ['10-23', 32], ['10-24', 7], ['10-25', 5]];
  function preset() { return S().clock || 'morning'; }
  function todayCount() {
    const base = { morning: 6, live: 11, evening: 27 }[preset()];
    return base + S().submissions.filter((x) => x.learner === S().me && jst(x.at).date === today()).length;
  }
  function pageHome() {
    const w = A.waiting();
    const oldest = w.slice().sort((a, b) => T(a.at) - T(b.at))[0];
    const oldDays = oldest ? Math.round((T(Clock.now()) - T(oldest.at)) / 864e5) : 0;
    const p = preset();
    const used = { morning: 142, live: 186, evening: 203 }[p];
    const liveN = { morning: null, live: 92, evening: 64 }[p];
    const pk = { morning: 57, live: 120, evening: 340 }[p];
    const alertsToday = S().alerts.concat(S().alertLog || []).filter((a) => jst(a.at).date === today());
    const openAlerts = S().alerts.filter((a) => a.status === 'open').length;
    const decidedToday = (S().decided || []).filter((d) => jst(d.at).date === today()).length;
    const data = DAILY.map(([md, v]) => {
      const d = new Date(`2026-${md}T12:00:00+09:00`);
      return { label: `${fmt.md(d)}（${fmt.weekday(d)}）`, short: String(Number(md.slice(3))), value: v };

  /* ---------- 提出チェック ---------- */

  function decidedPanel(sub) {
    const how = { ok: 'OK（このまま送った）', fixok: '直してOK（直して送った）', hold: '出さない' }[sub.decision] || '';

        <button class="btn btn-block" type="button" data-act="ad-reopen" data-id="${sub.id}">${ic('undo')}<span>確認待ちにもどす</span></button>`;
    }
    return html`<div class="ad-ai-head"><span class="ad-ai-label">${ic('send')}返事を送りました</span></div>
      <div class="banner ok">${ic('checkc')}<span class="b-text">${how}<p>${fmt.dt(sub.decidedAt)}・利用者に「${sub.shown === 'ok' ? 'できた' : '直してね'}」と表示</p></span></div>
      <div class="ad-sent-text">${sub.reply}</div>
      ${sub.learner === S().me ? html`<a class="btn btn-block" href="#/learner/task/${sub.task}?tab=chat">${ic('eye')}<span>利用者の画面で見る（試作）</span></a>` : ''}`;

  /* 下書きの入力・やさしい日本語 */
  function redrawDraftUI() {
    const pane = document.querySelector('.ad-aipane');
    if (!pane) return;
    const ta = pane.querySelector('#ad-draft');
    const len = pane.querySelector('[data-len]');
    if (len) len.textContent = ED.text.length + '文字';
    const easy = pane.querySelector('[data-easy]');
    if (easy) easy.innerHTML = Core.toHtml(easyPanel(ED.text));
    const sub = S().submissions.find((x) => x.id === ED.id);
    if (!sub) return;
    const edited = ED.text !== draftOf(sub);
    const okBtn = pane.querySelector('[data-act="ad-ok"]');
    if (okBtn) { if (ED.editing && edited) okBtn.setAttribute('aria-disabled', 'true'); else okBtn.removeAttribute('aria-disabled'); }
    const fixBtn = pane.querySelector('[data-act="ad-fix"]');
    if (fixBtn) { fixBtn.classList.toggle('is-armed', ED.editing); fixBtn.querySelector('.ad-d-sub').textContent = ED.editing ? 'この文で送る' : '直して送る'; }
    pane.querySelector('.ad-draft').classList.toggle('is-editing', ED.editing);
    if (ta) { ta.readOnly = !ED.editing; }
    const hint = pane.querySelector('#ad-draft-hint');
    if (hint) hint.innerHTML = ED.editing ? `直している時は <kbd>⌘</kbd>/<kbd>Ctrl</kbd>+<kbd>Enter</kbd> で送れます。${edited ? ` <button class="linkbtn" type="button" data-act="ad-draft-reset">${Icons.icon('undo')}もとの下書きにもどす</button>` : ''}` : 'AIが書いた下書きです。直す時は「直してOK」を押します。';
  }
  act('ad-draft-in', (el) => { ED.text = el.value; autoGrow(el); redrawDraftUI(); });
  act('ad-draft-reset', () => { const sub = S().submissions.find((x) => x.id === ED.id); if (!sub) return; ED.text = draftOf(sub); const ta = document.querySelector('#ad-draft'); if (ta) { ta.value = ED.text; autoGrow(ta); } redrawDraftUI(); });
  act('ad-easy-rep', (el) => {
    const i = Number(el.getAttribute('data-i'));
    if (el.getAttribute('data-scope') === 'wizard') { wzEasyRep(i); return; }
    ED.text = easyApply(ED.text, i);
    ED.editing = true;
    const ta = document.querySelector('#ad-draft');
    if (ta) { ta.value = ED.text; autoGrow(ta); }
    redrawDraftUI();
    UI.toast(`「${EASY[i].word}」を「${EASY[i].sugg}」に置きかえました`, { icon: 'textsize' });
  });
  act('ad-easy-find', (el) => {
    const w = el.getAttribute('data-w');
    if (el.getAttribute('data-scope') === 'wizard') { UI.toast(`「${w}」の所を直してください`, { icon: 'info' }); return; }
    const ta = document.querySelector('#ad-draft');
    if (!ta) return;
    const i = ta.value.indexOf(w);
    if (i < 0) return;
    ED.editing = true; redrawDraftUI();
    ta.focus(); ta.setSelectionRange(i, i + w.length);
  });
  act('ad-shown', (el) => {
    ED.shown[ED.id] = el.getAttribute('data-v');
    el.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-selected', B(b === el)));
  });

  /* 決める */
  function snapshot(sub) {
    const s = S();
    return JSON.stringify({ sub: s.submissions.find((x) => x.id === sub.id), chat: s.chats[sub.task] || null, task: s.tasks[sub.task] || null, notices: s.notices, decided: s.decided || [], works: s.works });
  }
  function restore(snap) {
    const o = JSON.parse(snap);
    Store.update((s) => {
      const i = s.submissions.findIndex((x) => x.id === o.sub.id);
      if (i >= 0) s.submissions[i] = o.sub;
      if (o.chat) s.chats[o.sub.task] = o.chat; else delete s.chats[o.sub.task];
      if (o.task) s.tasks[o.sub.task] = o.task; else delete s.tasks[o.sub.task];
      s.notices = o.notices; s.decided = o.decided; s.works = o.works;
    }, { silent: true });
  }
  function currentSub() { const c = App.current; if (!c || c.role !== 'admin') return null; return S().submissions.find((x) => x.id === ED.id) || null; }
  function decide(how, reason) {
    const sub = currentSub();
    if (!sub || sub.status !== 'waiting') return;
    const route = App.current;
    const f = route.query.f || 'waiting', v = route.query.v || 'all';
    const q = qs(route);
    const before = queue(f, v);
    const idx = before.findIndex((x) => x.id === sub.id);
    const snap = snapshot(sub);
    const text = how === 'ok' ? draftOf(sub) : ED.text;
    const shown = ED.shown[sub.id] || defaultShown(sub);
    const t = A.task(sub.task);
    Store.update((s) => {
      const x = s.submissions.find((y) => y.id === sub.id);
      const at = nowISO();
      x.status = how === 'hold' ? 'held' : 'sent';
      x.decision = how; x.decidedAt = at; x.fresh = false;
      x.reply = how === 'hold' ? null : text;
      x.shown = how === 'hold' ? null : shown;
      x.reason = reason || null;
      s.decided = (s.decided || []).concat([{ id: x.id, how, at, verdict: x.ai.verdict }]);
      if (how !== 'hold' && x.learner === s.me) {
        (s.chats[x.task] = s.chats[x.task] || []).push({ from: 'ops', at, who: `運営（${K.OPS.name}）`, text });
        const ts = s.tasks[x.task] = Object.assign({ checks: [] }, s.tasks[x.task] || {});
        ts.status = shown === 'ok' ? 'ok' : 'fix';
        if (shown === 'ok') ts.okAt = at;
        ts.unread = true;
        s.notices.unshift({ id: Core.uid('n'), type: 'reply', at, title: '運営から返事がとどきました', body: t ? t.title : '', go: `#/learner/task/${x.task}?tab=chat`, unread: true });
        if (shown === 'ok' && t && !s.works.some((w) => w.task === x.task)) {
          s.works.unshift({ id: Core.uid('w'), task: x.task, title: t.title, kind: x.kind === 'image' ? 'banner' : x.kind === 'video' ? 'video' : x.kind === 'text' ? 'sns' : 'blog', genre: t.genre === 'design' ? 'design' : 'web', at, status: 'ok', note: x.message || '指示書のとおりに作りました。', comment: text.split('\n').filter(Boolean).slice(1, 2).join('') || text.split('\n')[0], hue: 180 + (A.hash(x.id) % 160) });
        }
      }
    }, { silent: true });
    const u = A.person(sub.learner);
    const msg = how === 'hold' ? `${u.name}さんの提出を「出さない」にしました（返事は送っていません）` : `${u.name}さんに返事を送りました（${how === 'ok' ? 'OK' : '直してOK'}）`;
    UI.toast(msg, { icon: how === 'hold' ? 'x' : 'send', action: '取り消す', onAction: () => { restore(snap); ED.id = null; App.go(`#/admin/review/${sub.id}${q}`); App.render(); UI.toast('取り消しました', { icon: 'undo' }); } });
    const after = queue(f, v);
    const next = after[Math.min(Math.max(idx, 0), after.length - 1)];
    ED.id = null;
    const narrow = !window.matchMedia('(min-width: 760px)').matches;
    if (next) App.go(`#/admin/review/${next.id}${q}`);
    else App.go(`#/admin/review${q}`);
    if (!next && f === 'waiting' && v === 'all') setTimeout(() => UI.confetti(), 200);
    if (narrow && !next) App.go(`#/admin/review${q}`);
  }
  act('ad-ok', (el) => {
    const sub = currentSub(); if (!sub) return;
    if (ED.editing && ED.text !== draftOf(sub)) { UI.toast('文を直しています。「直してOK」で送ってください', { icon: 'info' }); return; }
    decide('ok');
  });
  act('ad-fix', () => {
    const sub = currentSub(); if (!sub) return;
    if (!ED.editing) {
      ED.editing = true; redrawDraftUI();
      const ta = document.querySelector('#ad-draft');
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); ta.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
      UI.toast('下書きを直せます。直したら もう一度「直してOK」', { icon: 'edit' });
      return;
    }
    if (!ED.text.trim()) { UI.toast('返事が からっぽです', { icon: 'info' }); return; }
    decide('fixok');
  });
  act('ad-hold', () => {
    const sub = currentSub(); if (!sub) return;
    UI.sheet({
      title: '出さないにしますか？', icon: ic('x'), iconCls: 'warn',
      body: html`<p class="ink2">返事は送りません。利用者には何も とどきません。理由をえらんでください。</p>
        <div class="stack-sm">${['同じものが2回目', '出す場所のまちがい', '個人情報の心配', 'ほかの方法で伝える（職員さん経由など）'].map((r, i) => html`<label class="checkline"><input type="radio" name="ad-reason" value="${r}" ${i === 0 ? 'checked' : ''}><span class="cl-box">${ic('check')}</span><span class="cl-text">${r}</span></label>`)}</div>`,
      foot: html`<button class="btn btn-lg" type="button" data-close>やめる</button><button class="btn btn-lg btn-danger" type="button" data-yes>${ic('x')}<span>出さない</span></button>`,
      mount: (sh, close) => {
        sh.querySelectorAll('.checkline input').forEach((r) => r.addEventListener('change', () => sh.querySelectorAll('.checkline').forEach((l) => l.classList.toggle('is-done', l.querySelector('input').checked))));
        sh.querySelector('.checkline').classList.add('is-done');
        sh.querySelector('[data-yes]').addEventListener('click', () => { const r = sh.querySelector('input[name="ad-reason"]:checked'); close(); decide('hold', r ? r.value : ''); });
      }
    });
  });
  act('ad-reopen', (el) => {
    const id = el.getAttribute('data-id');
    Store.update((s) => { const x = s.submissions.find((y) => y.id === id); if (x) { x.status = 'waiting'; x.decision = null; x.reason = null; x.decidedAt = null; } });
    App.go(`#/admin/review/${id}`);
    UI.toast('確認待ちにもどしました', { icon: 'undo' });
  });
  document.addEventListener('keydown', (e) => {
    const cur = App.current;
    if (!cur || cur.role !== 'admin' || cur.parts[0] !== 'review') return;
    if (document.querySelector('.sheet-wrap')) return;
    const a = document.activeElement;
    const typing = a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.isContentEditable);
    const click = (sel) => { const b = document.querySelector(sel); if (b) b.click(); };
    if (typing) {
      if (a.id === 'ad-draft' && (e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); click('[data-act="ad-fix"]'); }
      else if (a.id === 'ad-draft' && e.key === 'Escape') a.blur();
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === '1') { e.preventDefault(); click('[data-act="ad-ok"]'); }
    else if (k === '2') { e.preventDefault(); click('[data-act="ad-fix"]'); }
    else if (k === '3') { e.preventDefault(); click('[data-act="ad-hold"]'); }
    else if (k === 'e') { e.preventDefault(); if (!ED.editing) click('[data-act="ad-fix"]'); else { const ta = document.querySelector('#ad-draft'); if (ta) ta.focus(); } }
    else if (k === 'j' || k === 'k') {
      e.preventDefault();
      const f = cur.query.f || 'waiting', v = cur.query.v || 'all';
      const list = queue(f, v);
      const i = list.findIndex((x) => x.id === ED.id);
      const n = list[Math.min(Math.max(i + (k === 'j' ? 1 : -1), 0), list.length - 1)];
      if (n) App.go(`#/admin/review/${n.id}${qs(cur)}`);
    }
  });

  /* ---------- 配信（課題・授業・教材） ---------- */
  function subCount(taskId) { return 4 + (A.hash(taskId) % 24) + S().submissions.filter((x) => x.task === taskId).length; }
  function dueOf(t) { const fx = (S().adFix || {})[t.id]; return fx ? fx + 'T23:59:00+09:00' : t.due; }
  function pageDeliver(route) {

    return {
      title: '配信', nav: 'deliver', wide: true,
      html: html`<div class="page">
        <div class="page-head"><div class="ph-text"><h1>配信</h1><p class="lead">課題・授業・教材を とどけます。カタログの気になる所も ここで直せます。</p></div>
          <div class="ph-actions"><a class="btn btn-primary btn-lg" href="#/admin/deliver/new">${ic('plus')}<span>課題を新しく作る</span></a></div></div>

        <div class="table-wrap"><table class="table"><thead><tr><th>題名</th><th>級</th><th>作り方</th><th>公開</th><th>締め切り</th><th>とどける先</th></tr></thead><tbody>${extra.map((t) => html`<tr><td><b>${t.title}</b></td><td>${A.lv(t.level)}</td><td>${t.method ? K.METHODS[t.method].short : '—'}</td><td class="num">${fmt.md(t.publish)}</td><td class="num">${fmt.md(t.due)}</td><td>${t.to === 'some' ? `${(t.facs || []).length}事業所` : '全員'}</td></tr>`)}</tbody></table></div></section>` : ''}
      <section class="card card-pad sec">

          ${ms.map((m) => { const t = blog.find((x) => x.method === m && x.level === lv); if (!t) return ''; const bad = issueIds.includes(t.id) && !fixes[t.id]; return html`<div class="ad-mxl-row ${bad ? 'is-bad' : ''}"><span class="ad-mxl-m">${ic(K.METHODS[m].icon)}${K.METHODS[m].short.replace('版', '')}</span><span class="grow"><b>${t.title}</b><span class="xsmall muted">締め切り ${fmt.md(dueOf(t))}・提出 ${subCount(t.id)}</span>${bad ? html`<button class="ad-warn-badge" type="button" data-act="ad-fix-due" data-id="${t.id}">${ic('alert')}締め切りが公開日より前 → 10/31にする</button>` : ''}</span></div>`; })}</div>`)}</div>
        <div class="ad-mx-wrap hide-sp"><table class="ad-mx">
          <thead><tr><th></th>${lvs.map((lv) => html`<th>${A.lv(lv)}<span class="ad-mx-theme">${K.THEMES[lv].short}</span></th>`)}</tr></thead>
          <tbody>${ms.map((m) => html`<tr><th scope="row">${ic(K.METHODS[m].icon)}${K.METHODS[m].name}</th>${lvs.map((lv) => {
            const t = blog.find((x) => x.method === m && x.level === lv);

              <span class="xsmall muted">締め切り ${fmt.md(dueOf(t))}・提出 ${subCount(t.id)}</span>
              ${bad ? html`<button class="ad-warn-badge" type="button" data-act="ad-fix-due" data-id="${t.id}">${ic('alert')}締め切りが公開日より前 → 10/31にする</button>` : (issueIds.includes(t.id) ? html`<span class="chip chip-ok">${ic('check')}締め切りを直しました</span>` : '')}</div></td>`;

    </div>`;

  function deliverClass() {
    const wd = jst(Clock.now()).wd;
    const days = ['', '月', '火', '水', '木', '金'];
    const byG = groupBy(C.archives, (a) => a.genre);
    const ls = livePeriods();
    return html`<div class="stack-lg">
      <section class="card card-pad sec"><div class="sec-head"><h2>${ic('calendar')}授業LIVEの時間割（平日 10:10から）</h2><button class="btn btn-sm" type="button" data-act="noop">${ic('edit')}<span>時間割を変える</span></button></div>

            if (p.rest) return html`<td class="${d === wd ? 'is-today' : ''}"><span class="xsmall muted">お昼休み</span></td>`;

            return html`<td class="${d === wd ? 'is-today' : ''}"><span class="ad-tt-cell ${G.cls} ${isNow ? 'is-now' : ''}">${ic(G.icon)}<span><b>${G.name}</b><small>${K.TEACHERS[g]}</small></span>${isNow ? html`<em>LIVE中</em>` : ''}</span></td>`;

      checks: ['タイトルが指示書と同じになっている', '見出しが3つある', 'スマホで見ても、文字がはみ出さない'],
      submit: 'url', publish: '2026-10-26', due: '2026-11-30', to: 'all', facs: [] };

  const WZ_STEPS = ['まとまり', '作り方 × 級', '指示書', 'とどける日・先', '確認'];
  function wzTasks() {
    const out = [];

      if (!WZ.cells[`${m}:${lv}`]) return;
      out.push({ m, lv, title: `${WZ.themes[lv] || K.LEVELS[lv].name}（${K.METHODS[m].short}）` });
    }));
    return out;
  }
  function wzErr() {
    if (WZ.step === 1 && !WZ.name.trim()) return 'まとまりの名前を入れてください';
    if (WZ.step === 2 && !wzTasks().length) return '少なくとも1つ えらんでください';
    if (WZ.step === 3 && (!WZ.summary.some((x) => x.trim()) || !WZ.checks.some((x) => x.trim()))) return '「やること」と「チェック項目」を1つ以上 入れてください';
    if (WZ.step === 4) {
      if (!WZ.publish || !WZ.due) return '公開日と締め切りを入れてください';
      if (WZ.due < WZ.publish) return '締め切りが公開日より前になっています';
      if (WZ.to === 'some' && !WZ.facs.length) return 'とどける事業所を えらんでください';

          <div class="stack-sm">${['beginner', 'middle', 'advanced'].map((lv) => html`<div class="ad-wz-theme">${A.lv(lv)}<input class="input grow" data-input="ad-wz" data-k="themes.${lv}" value="${WZ.themes[lv]}" aria-label="${K.LEVELS[lv].name}のテーマ"><span class="ad-wz-min"><input class="input" type="number" min="10" step="10" data-input="ad-wz" data-k="mins.${lv}" value="${WZ.mins[lv]}" aria-label="${K.LEVELS[lv].name}の目安（分）"><span class="xsmall muted">分</span></span></div>`)}</div></div>
      </div>`;
    } else if (st === 2) {
      const n = wzTasks().length;
      body = html`<div class="stack">

          <tbody>${['studio', 'ai', 'image'].map((m) => html`<tr><th scope="row">${ic(K.METHODS[m].icon)}${K.METHODS[m].name}</th>${['beginner', 'middle', 'advanced'].map((lv) => html`<td><label class="ad-pick-cell ${WZ.cells[`${m}:${lv}`] ? 'is-on' : ''}"><input type="checkbox" data-change="ad-wz-cell" data-c="${m}:${lv}" ${WZ.cells[`${m}:${lv}`] ? 'checked' : ''}><span class="ad-pick-box">${ic('check')}</span><span class="xsmall">${WZ.cells[`${m}:${lv}`] ? '作る' : '作らない'}</span></label></td>`)}</tr>`)}</tbody></table></div>
        <div class="cluster"><button class="btn btn-sm" type="button" data-act="ad-wz-all" data-v="1">${ic('check')}<span>ぜんぶ</span></button><button class="btn btn-sm btn-ghost" type="button" data-act="ad-wz-all" data-v="0">${ic('x')}<span>ぜんぶ外す</span></button></div>

          ${WZ.checks.map((x, i) => html`<div class="row"><input class="input grow" data-input="ad-wz" data-k="checks.${i}" value="${x}" aria-label="チェック ${i + 1}"><button class="icon-btn" type="button" data-act="ad-wz-rmcheck" data-i="${i}" aria-label="けす">${ic('trash')}</button></div>`)}

        ${WZ.due && WZ.publish && WZ.due < WZ.publish ? html`<div class="banner bad">${ic('alert')}<span class="b-text">締め切りが公開日より前です<p>カタログにも同じまちがいが3つありました。ここでは先に止めます。</p></span></div>` : html`<div class="banner ok">${ic('checkc')}<span class="b-text">公開から締め切りまで ${Math.round((new Date(WZ.due) - new Date(WZ.publish)) / 864e5)}日あります</span></div>`}
        <div class="field"><span class="label">とどける先</span><div class="seg" role="group">${[['all', '全員（全事業所）'], ['some', '事業所をえらぶ']].map(([k, n]) => html`<button type="button" data-act="ad-wz-set" data-k="to" data-v="${k}" aria-selected="${B(WZ.to === k)}">${n}</button>`)}</div></div>
        ${WZ.to === 'some' ? html`<div class="ad-fac-pick">${S().facilities.map((f) => html`<label class="ad-fp"><input type="checkbox" data-change="ad-wz-fac" data-id="${f.id}" ${WZ.facs.includes(f.id) ? 'checked' : ''}><span>${f.name}</span><span class="xsmall muted">${f.learners}人</span></label>`)}</div>` : ''}
      </div>`;
    } else {
      const list = wzTasks();
      body = html`<div class="stack">
        <div class="banner">${ic('info')}<span class="b-text">「${WZ.name}」として <b>${list.length}つ</b>の課題を配信します<p>公開 ${fmt.date(WZ.publish + 'T12:00:00+09:00')} ・ 締め切り ${fmt.date(WZ.due + 'T12:00:00+09:00')} ・ ${WZ.to === 'all' ? '全員' : `${WZ.facs.length}事業所`}</p></span></div>

        <div class="card card-soft card-pad stack-sm"><b>${ic('file')} 指示書（${WZ.summary.filter(Boolean).length}行・チェック${WZ.checks.filter(Boolean).length}こ）</b><ol class="ad-checks">${WZ.summary.filter(Boolean).map((x) => html`<li>${x}</li>`)}</ol></div>

        <div class="steps ad-wz-steps" style="--n:5">${WZ_STEPS.map((n, i) => html`<button class="step ${i + 1 < st ? 'done' : i + 1 === st ? 'now' : ''}" type="button" data-act="ad-wz-go" data-s="${i + 1}"><span class="st-dot">${i + 1 < st ? ic('check') : i + 1}</span><span>${n}</span></button>`)}</div>

  function wzSetPath(k, v) { const parts = k.split('.'); if (parts.length === 1) WZ[k] = v; else WZ[parts[0]][parts[1]] = v; }

  });

  act('ad-wz-all', (el) => { const on = el.getAttribute('data-v') === '1'; Object.keys(WZ.cells).forEach((k) => { WZ.cells[k] = on; }); App.render({ keepScroll: true }); });
  act('ad-wz-date', (el) => { WZ[el.getAttribute('data-k')] = el.value; App.render({ keepScroll: true }); });

            <span class="ri-end">${isA ? html`<button class="btn btn-sm btn-ghost" type="button" data-act="ad-job-unassign" data-id="${j.id}">取り消す</button>` : html`<button class="btn btn-sm btn-primary" type="button" data-act="ad-job-assign" data-id="${j.id}" data-u="${u.id}">${ic('usercheck')}<span>この人にお願いする</span></button>`}</span></li>`; })}</ul></div>`
            : html`<div class="empty card">${raw(Icons.pikuto(72, 'think'))}<span class="em-title">まだ だれも手をあげていません</span><span>利用者の「案件ボード」に出ています</span></div>`}
        </section>
        <p class="small muted">${ic('info')} お願いする人を決めたら、その人の事業所の職員さんと いっしょに進め方を決めます。</p>
      </div>`
    };
  }
  act('ad-job-assign', (el) => { const id = el.getAttribute('data-id'), u = el.getAttribute('data-u'); Store.update((s) => { const j = s.jobs.find((x) => x.id === id); j.assigned = u; }); UI.toast(`${A.person(u).name}さんに お願いしました`, { icon: 'usercheck' }); });
  act('ad-job-unassign', (el) => { const id = el.getAttribute('data-id'); Store.update((s) => { const j = s.jobs.find((x) => x.id === id); delete j.assigned; }); UI.toast('取り消しました', { icon: 'undo' }); });
  act('ad-job-st', (el) => { const id = el.getAttribute('data-id'); Store.update((s) => { s.jobs.find((x) => x.id === id).status = el.getAttribute('data-v'); }); });
  act('ad-job-new', () => {
    UI.sheet({
      title: '新しい案件', icon: ic('briefcase'), wide: true,
      body: html`<form class="stack" id="ad-jf">
        <div class="field"><label class="label" for="jf-t">案件の名前</label><input class="input" id="jf-t" name="title" placeholder="例：地域のパン屋さんのチラシ（A4 1まい）" required></div>
        <div class="grid-2">
          <div class="field"><label class="label" for="jf-g">ジャンル</label><select class="select" id="jf-g" name="genre">${['web', 'design', 'video', 'sns', 'ai', 'pc'].map((g) => html`<option value="${g}">${K.GENRES[g].name}</option>`)}</select></div>
          <div class="field"><label class="label" for="jf-l">いる級</label><select class="select" id="jf-l" name="level">${['beginner', 'middle', 'advanced'].map((l) => html`<option value="${l}">${K.LEVELS[l].name}から</option>`)}</select></div>
          <div class="field"><label class="label" for="jf-a">量</label><input class="input" id="jf-a" name="amount" placeholder="例：画像 1まい"></div>
          <div class="field"><label class="label" for="jf-p">期間</label><input class="input" id="jf-p" name="period" placeholder="例：11月10日〜11月20日"></div>
        </div>
        <div class="field"><label class="label" for="jf-c">たのむ人（会社・お店）</label><input class="input" id="jf-c" name="client" placeholder="例：架空ベーカリー"></div>
        <div class="field"><label class="label" for="jf-n">利用者へのひとこと<span class="opt">（なくてもOK）</span></label><input class="input" id="jf-n" name="note" placeholder="例：写真は運営からわたします"></div>
        <label class="checkline"><input type="checkbox" name="practice"><span class="cl-box">${ic('check')}</span><span class="cl-text">練習用（納品なし）にする</span></label>
        <p class="xsmall muted">${ic('info')} 利用者の画面には、お金のことは出ません。</p>
      </form>`,
      foot: html`<button class="btn btn-lg" type="button" data-close>やめる</button><button class="btn btn-primary btn-lg" type="button" data-yes>${ic('plus')}<span>案件ボードに出す</span></button>`,
      mount: (sh, close) => {
        sh.querySelector('input[name="practice"]').addEventListener('change', (e) => e.target.closest('.checkline').classList.toggle('is-done', e.target.checked));
        sh.querySelector('[data-yes]').addEventListener('click', () => {
          const fm = sh.querySelector('#ad-jf');
          const title = fm.title.value.trim();
          if (!title) { fm.title.focus(); UI.toast('案件の名前を入れてください', { icon: 'info' }); return; }
          const g = fm.genre.value, lv = fm.level.value;
          const job = { id: Core.uid('j'), title, genre: g, need: { genre: g === 'ai' ? 'sns' : g, level: lv, text: `${K.GENRES[g].name} ${K.LEVELS[lv].name}の課題を1つ出した人` }, amount: fm.amount.value.trim() || '—', period: fm.period.value.trim() || '相談して決めます', due: null, status: 'open', client: fm.client.value.trim() || '（未定）', applicants: [], note: fm.note.value.trim(), practice: fm.practice.checked };
          Store.update((s) => { s.jobs.unshift(job); }, { silent: true });
          close();
          UI.toast('案件ボードに出しました（利用者の案件ボードにも出ます）', { icon: 'briefcase' });
          App.go(`#/admin/job/${job.id}`);
