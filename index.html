<html lang="ja" data-role="entrance" data-fs="1" data-theme="light">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="エスピクトスクール アプリの試作（利用者・職員・運営）">
<title>エスピクトスクール（試作）</title>

<style>/* css/tokens.css */
/* =========================================================
   エスピクトスクール 試作 — デザインの決まり（色・文字・形）
   ・色はすべて「役わり」の名前で使う（--ink, --primary など）
   ・ダーク／くっきり表示は、この役わりの値だけを入れかえる
   ========================================================= */

:root {
  /* ---- ブランド（公開ページの水色をもとにした段階） ---- */
  --brand-50:  #eaf7fc;
  --brand-100: #d3eef9;
  --brand-200: #a9ddf2;
  --brand-300: #6cc6ea;
  --brand-400: #22aee0;
  --brand-500: #0094c8;
  --brand-600: #0077a8;
  --brand-700: #005f87;
  --brand-800: #0b4a68;
  --brand-900: #0d3349;
  --cyan:      #00b8ec;

  /* ---- アクセント（元気・LIVE） ---- */
  --pink-50:  #fdebf2;
  --pink-500: #e2367a;
  --pink-600: #c81e63;
  --sun-50:   #fff7e0;
  --sun-300:  #ffd66b;
  --sun-400:  #ffc53d;

  /* ---- 状態の色（いつも アイコン＋ことば と いっしょに使う） ---- */
  --ok:        #177a51;  --ok-soft:   #e6f5ee;  --ok-ink:   #135f40;
  --warn:      #b86e00;  --warn-soft: #fff4d6;  --warn-ink: #7a4b00;
  --bad:       #c62828;  --bad-soft:  #fdecec;  --bad-ink:  #9f1d1d;
  --info:      #0077a8;  --info-soft: #e3f3fa;  --info-ink: #005f87;

  /* ---- 級の色（カタログの 🟢🟡🔴 に合わせる） ---- */
  --lv1: #177a51;  --lv1-soft: #e6f5ee;
  --lv2: #9a6700;  --lv2-soft: #fff1c9;  --lv2-dot: #f2b705;
  --lv3: #c62828;  --lv3-soft: #fdecec;

  /* ---- ジャンルの色（白い文字が 4.5:1 以上になる濃さ） ---- */
  --g-pc:      #50657a;
  --g-web:     #0077a8;
  --g-ai:      #0b7a70;
  --g-design:  #c42d68;
  --g-video:   #6a4fcf;
  --g-sns:     #b35200;
  --g-esports: #3d7a2e;

  /* ---- 役わりの色（明るい画面） ---- */
  --bg:          #f2f6f9;
  --bg-tint:     #e8f3f8;
  --surface:     #ffffff;
  --surface-2:   #f6f9fb;
  --surface-3:   #edf3f7;
  --line:        #dbe5ec;
  --line-strong: #b9cad6;
  --ink:         #0f2a3c;
  --ink-2:       #3a5264;
  --ink-3:       #566b7d;
  --primary:     #0077a8;
  --primary-hover:#00698f;
  --primary-ink: #ffffff;
  --primary-soft:#e3f3fa;
  --primary-soft-ink:#005f87;
  --live:        #d42a6c;
  --live-soft:   #fdebf2;
  --live-ink:    #a5154f;
  --focus:       #ffb703;
  --focus-ring:  0 0 0 3px var(--surface), 0 0 0 6px #0f2a3c;
  --scrim:       rgba(10, 28, 40, .48);

  --hero-1: #0679ad;
  --hero-2: #00517f;
  --hero-ink: #ffffff;

  /* ---- 形 ---- */
  --r-xs: 8px;
  --r-sm: 12px;
  --r:    16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-full: 999px;

  --sh-1: 0 1px 2px rgba(15, 42, 60, .06), 0 1px 1px rgba(15, 42, 60, .03);
  --sh-2: 0 2px 6px rgba(15, 42, 60, .06), 0 8px 24px rgba(15, 42, 60, .07);
  --sh-3: 0 10px 30px rgba(15, 42, 60, .16), 0 2px 8px rgba(15, 42, 60, .08);
  --sh-pop: 0 18px 50px rgba(8, 30, 48, .28);

  /* ---- 文字 ---- */
  --font: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
          "Yu Gothic UI", "YuGothic", "Meiryo", system-ui, sans-serif;
  --font-num: "SF Pro Rounded", "Hiragino Sans", "BIZ UDPGothic", system-ui, sans-serif;
  --lh: 1.75;
  --lh-tight: 1.4;

  /* ---- 動き ---- */
  --ease: cubic-bezier(.2, .8, .2, 1);
  --t-fast: 120ms;
  --t: 200ms;
  --t-slow: 360ms;

  /* ---- レイアウト ---- */
  --topbar-h: 60px;
  --tabbar-h: 68px;
  --side-w: 248px;
  --content-max: 1180px;
  --safe-b: env(safe-area-inset-bottom, 0px);

  color-scheme: light;
}

/* ---- 文字の大きさ（3段階） ---- */
html[data-fs="1"] { font-size: 106.25%; } /* 17px：ふつう */
html[data-fs="2"] { font-size: 118.75%; } /* 19px：大きい */
html[data-fs="3"] { font-size: 137.5%;  } /* 22px：とても大きい */
html[data-role="staff"][data-fs="1"],
html[data-role="admin"][data-fs="1"] { font-size: 100%; }
html[data-role="staff"][data-fs="2"],
html[data-role="admin"][data-fs="2"] { font-size: 112.5%; }
html[data-role="staff"][data-fs="3"],
html[data-role="admin"][data-fs="3"] { font-size: 125%; }

/* =========================================================
   ダークモード
   ========================================================= */
html[data-theme="dark"] {
  --bg:          #0a1620;
  --bg-tint:     #0d1f2c;
  --surface:     #112230;
  --surface-2:   #152a3a;
  --surface-3:   #1a3244;
  --line:        #24394b;
  --line-strong: #36506a;
  --ink:         #e7f0f6;
  --ink-2:       #c2d3df;
  --ink-3:       #9fb4c4;
  --primary:     #3cb5e6;
  --primary-hover:#5cc4ee;
  --primary-ink: #04121b;
  --primary-soft:#0f3347;
  --primary-soft-ink:#8fd6f3;
  --live:        #ff6fa3;
  --live-soft:   #3a1527;
  --live-ink:    #ffb3cf;
  --focus-ring:  0 0 0 3px var(--bg), 0 0 0 6px #ffd166;
  --scrim:       rgba(0, 0, 0, .6);

  --ok:   #57d39a; --ok-soft:   #10301f; --ok-ink:   #8fe6bd;
  --warn: #ffc857; --warn-soft: #33270b; --warn-ink: #ffd98a;
  --bad:  #ff8a80; --bad-soft:  #3a1616; --bad-ink:  #ffb4ac;
  --info: #5cc6f0; --info-soft: #0f3347; --info-ink: #8fd6f3;

  --lv1: #57d39a; --lv1-soft: #10301f;
  --lv2: #ffd166; --lv2-soft: #33270b; --lv2-dot: #ffd166;
  --lv3: #ff8a80; --lv3-soft: #3a1616;

  --hero-1: #0b6f96;
  --hero-2: #0a3f63;

  --sh-1: 0 1px 2px rgba(0, 0, 0, .3);
  --sh-2: 0 2px 6px rgba(0, 0, 0, .25), 0 8px 24px rgba(0, 0, 0, .25);
  --sh-3: 0 10px 30px rgba(0, 0, 0, .45);
  --sh-pop: 0 18px 50px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

/* =========================================================
   くっきり表示（コントラストを強く・線を太く・下線を出す）
   ========================================================= */
html[data-contrast="high"] {
  --bg:          #ffffff;
  --bg-tint:     #ffffff;
  --surface:     #ffffff;
  --surface-2:   #ffffff;
  --surface-3:   #f0f0f0;
  --line:        #000000;
  --line-strong: #000000;
  --ink:         #000000;
  --ink-2:       #000000;
  --ink-3:       #1a1a1a;
  --primary:     #004a6e;
  --primary-hover:#003a57;
  --primary-soft:#ffffff;
  --primary-soft-ink:#003a57;
  --live:        #9c0f45;
  --live-soft:   #ffffff;
  --live-ink:    #7a0a35;
  --ok: #0b5233; --ok-soft: #ffffff; --ok-ink: #0b5233;
  --warn: #6b4100; --warn-soft: #ffffff; --warn-ink: #6b4100;
  --bad: #8f1414; --bad-soft: #ffffff; --bad-ink: #8f1414;
  --info: #004a6e; --info-soft: #ffffff; --info-ink: #004a6e;
  --lv1: #0b5233; --lv2: #6b4100; --lv3: #8f1414;
  --lv1-soft: #ffffff; --lv2-soft: #ffffff; --lv3-soft: #ffffff;
  --hero-1: #004a6e; --hero-2: #002b40;
  --sh-1: none; --sh-2: none; --sh-3: 0 0 0 2px #000; --sh-pop: 0 0 0 3px #000;
  --focus-ring: 0 0 0 3px #ffffff, 0 0 0 7px #000000;
}
html[data-contrast="high"][data-theme="dark"] {
  --bg: #000000; --bg-tint: #000000; --surface: #000000; --surface-2: #000000; --surface-3: #111111;
  --line: #ffffff; --line-strong: #ffffff;
  --ink: #ffffff; --ink-2: #ffffff; --ink-3: #f0f0f0;
  --primary: #ffe14d; --primary-hover: #fff07a; --primary-ink: #000000;
  --primary-soft: #000000; --primary-soft-ink: #ffe14d;
  --live: #ff8fbd; --live-soft: #000000; --live-ink: #ff8fbd;
  --ok: #7dffb8; --ok-soft: #000; --ok-ink: #7dffb8;
  --warn: #ffd84d; --warn-soft: #000; --warn-ink: #ffd84d;
  --bad: #ff9e9e; --bad-soft: #000; --bad-ink: #ff9e9e;
  --info: #7fdcff; --info-soft: #000; --info-ink: #7fdcff;
  --lv1: #7dffb8; --lv2: #ffd84d; --lv3: #ff9e9e;
  --lv1-soft: #000; --lv2-soft: #000; --lv3-soft: #000;
  --hero-1: #000000; --hero-2: #000000;
  --focus-ring: 0 0 0 3px #000000, 0 0 0 7px #ffe14d;
  --sh-3: 0 0 0 2px #fff; --sh-pop: 0 0 0 3px #fff;
}

/* 動きをへらす（設定 または 端末の設定） */
html[data-motion="reduce"] { --t-fast: 0ms; --t: 0ms; --t-slow: 0ms; }
@media (prefers-reduced-motion: reduce) {
  :root { --t-fast: 0ms; --t: 0ms; --t-slow: 0ms; }
}

</style>
<style>/* css/base.css */
/* =========================================================
   土台：リセット・文字・レイアウトの部品
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: calc(var(--topbar-h) + 12px); }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 1rem;
  line-height: var(--lh);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "palt" 0;
  overflow-wrap: anywhere;
  line-break: strict;
  word-break: normal;
  word-break: auto-phrase; /* 日本語を「ことばのまとまり」で折り返す（対応ブラウザのみ） */
}
img, svg, video, canvas { display: block; max-width: 100%; }
svg { flex-shrink: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
html[data-contrast="high"] a { text-decoration: underline; text-underline-offset: 3px; }
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
h1, h2, h3, h4 { line-height: var(--lh-tight); font-weight: 800; letter-spacing: .01em; font-feature-settings: "palt" 1; }
strong, b { font-weight: 800; }
hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
:focus { outline: none; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--r-xs); }
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { box-shadow: none; }
::selection { background: var(--brand-200); color: #0f2a3c; }
[hidden] { display: none !important; }

ruby { ruby-position: over; ruby-align: center; }
.furi { display: inline; }
rt { font-size: .52em; font-weight: 600; color: var(--ink-2); letter-spacing: 0; line-height: 1; user-select: none; }
.btn rt, .hero rt, .live-card rt { color: inherit; opacity: .9; }

/* 数字：表や時刻はそろえる、大きな数字はそのまま */
.num, time, .tabnum { font-variant-numeric: tabular-nums; }

/* ---- 見えないけれど読み上げに使う ---- */
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: fixed; left: 12px; top: -60px; z-index: 1000; background: var(--ink); color: var(--surface);
  padding: 10px 16px; border-radius: var(--r-sm); font-weight: 700; transition: top var(--t);
}
.skip-link:focus { top: 12px; }

/* =========================================================
   アプリの骨組み
   ========================================================= */
.app {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  grid-template-columns: 1fr;
}
.main-col { min-width: 0; display: flex; flex-direction: column; }
.main {
  flex: 1;
  width: 100%;
  max-width: var(--content-max);
  margin: 0 auto;
  padding: 20px 16px calc(var(--tabbar-h) + 40px + var(--safe-b));
}
.main.main-wide { max-width: 1480px; }
.main.main-flush { padding: 0; max-width: none; }

@media (min-width: 760px) {
  .app { grid-template-columns: 92px 1fr; }
  .main { padding: 28px 28px 56px; }
}
@media (min-width: 1100px) {
  .app { grid-template-columns: var(--side-w) 1fr; }
  .main { padding: 32px 40px 64px; }
}

/* ---- 上のバー ---- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  height: var(--topbar-h);
  display: flex; align-items: center; gap: 4px;
  padding: 0 8px 0 12px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
}
html[data-contrast="high"] .topbar { background: var(--surface); border-bottom-width: 2px; }
.topbar .tb-title { font-weight: 800; font-size: 1.05rem; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 4px; }
.topbar .tb-spacer { flex: 1; }
.topbar .tb-back { margin-left: -6px; }
@media (min-width: 760px) {
  .topbar { padding: 0 20px 0 24px; height: 64px; gap: 8px; }
}

/* ---- 左のメニュー（PC・タブレット） ---- */
.side {
  display: none;
  position: sticky; top: 0; height: 100vh; height: 100dvh;
  background: var(--surface);
  border-right: 1px solid var(--line);
  flex-direction: column;
  overflow-y: auto;
  scrollbar-width: thin;
}
@media (min-width: 760px) { .side { display: flex; } }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 20px 18px 14px; }
.side-brand .wordmark { font-weight: 900; font-size: 1.02rem; letter-spacing: .02em; line-height: 1.2; }
.side-brand .role-tag { font-size: .72rem; font-weight: 800; color: var(--ink-3); letter-spacing: .06em; }
.side-nav { display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; }
.side-nav .nav-group { margin: 14px 10px 4px; font-size: .74rem; font-weight: 800; color: var(--ink-3); letter-spacing: .08em; }
.nav-item {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  min-height: 48px; padding: 10px 14px;
  border-radius: var(--r-sm);
  color: var(--ink-2); font-weight: 700;
  transition: background var(--t-fast), color var(--t-fast);
}
.nav-item:hover { background: var(--surface-3); color: var(--ink); text-decoration: none; }
.nav-item[aria-current="page"] { background: var(--primary-soft); color: var(--primary-soft-ink); }
.nav-item[aria-current="page"]::before {
  content: ""; position: absolute; left: -12px; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--primary);
}
html[data-contrast="high"] .nav-item[aria-current="page"] { outline: 2px solid var(--ink); }
.nav-item .nav-badge { margin-left: auto; }
.side-foot { margin-top: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }

/* タブレット幅：アイコンと短いことばだけ */
@media (min-width: 760px) and (max-width: 1099px) {
  .side-brand { justify-content: center; padding: 16px 8px 10px; }
  .side-brand .brand-text { display: none; }
  .side-nav { padding: 6px 8px; }
  .side-nav .nav-group { display: none; }
  .nav-item { flex-direction: column; gap: 4px; padding: 10px 4px; font-size: .72rem; text-align: center; line-height: 1.25; }
  .nav-item[aria-current="page"]::before { left: -8px; }
  .nav-item .nav-badge { position: absolute; top: 4px; right: 10px; margin: 0; }
  .side-foot .hide-rail { display: none; }
}

/* ---- 下のタブ（スマホ） ---- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  height: calc(var(--tabbar-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(16px);
  backdrop-filter: saturate(1.4) blur(16px);
  border-top: 1px solid var(--line);
}
html[data-contrast="high"] .tabbar { background: var(--surface); border-top-width: 2px; }
@media (min-width: 760px) { .tabbar { display: none; } }
.tab {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3); font-size: .7rem; font-weight: 800; letter-spacing: .02em;
  min-width: 0;
}
.tab:hover { text-decoration: none; color: var(--ink); }
.tab .tab-ico {
  display: grid; place-items: center; width: 56px; height: 32px; border-radius: var(--r-full);
}
.tab .tab-ico .ico { width: 24px; height: 24px; }
.tab .tab-ico {
  transition: background var(--t), transform var(--t) var(--ease);
}
.tab[aria-current="page"] { color: var(--primary-soft-ink); }
.tab[aria-current="page"] .tab-ico { background: var(--primary-soft); }
html[data-contrast="high"] .tab[aria-current="page"] .tab-ico { outline: 2px solid var(--ink); }
.tab .tab-badge { position: absolute; top: 6px; left: calc(50% + 10px); }
.tab:active .tab-ico { transform: scale(.92); }

/* ---- ページの見出し ---- */
.page { display: flex; flex-direction: column; gap: 20px; animation: page-in var(--t-slow) var(--ease) both; }
@keyframes page-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; }
.page-head .ph-text { flex: 1 1 260px; min-width: 0; }
.page-head h1 { font-size: 1.6rem; }
.page-head .lead { color: var(--ink-2); margin-top: 4px; }
.page-head .ph-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.eyebrow { font-size: .78rem; font-weight: 800; color: var(--ink-3); letter-spacing: .08em; }
@media (min-width: 760px) { .page-head h1 { font-size: 1.85rem; } .page { gap: 24px; } }

.sec { display: flex; flex-direction: column; gap: 12px; }
.sec-head { display: flex; align-items: center; gap: 8px 10px; justify-content: space-between; flex-wrap: wrap; }
.sec-head h2 { font-size: 1.18rem; display: flex; align-items: center; gap: 8px; }
.sec-head > h2:first-child { flex: 1 1 auto; min-width: min(100%, 9em); }
.sec-head h2 .ico-wrap { color: var(--primary); }
.sec-head .sec-more { font-weight: 700; font-size: .9rem; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }

/* ---- よく使う並べ方 ---- */
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-sm { display: flex; flex-direction: column; gap: 6px; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; }
.cluster { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row { display: flex; align-items: center; gap: 12px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.grow { flex: 1; min-width: 0; }

<style>/* css/art.css */
/* 作品の見本（中の文字は、入れ物の はばに合わせて大きさが変わる） */
.art { position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden; container-type: inline-size; isolation: isolate; font-family: var(--font); }

/* ブログのページ */
.art-blog { background: hsl(var(--h) 30% 92%); }
.art-blog .art-in { display: flex; flex-direction: column; }
.art-blog .ag-bar { height: 7cqw; display: flex; align-items: center; gap: 1.2cqw; padding: 0 2.5cqw; background: hsl(var(--h) 18% 84%); }

.art-blog .ag-page { flex: 1; margin: 0 4cqw; background: #fff; padding: 2.4cqw 4cqw; display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: auto auto auto 1fr; gap: 1.6cqw 3cqw; color: #1b2b38; }
.art-blog .ag-head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }

.art-blog .ag-nav { width: 22cqw; height: 1.8cqw; border-radius: 2cqw; background: #dfe6ec; }
.art-blog .ag-title { grid-column: 1 / -1; font-weight: 900; font-size: 4.6cqw; line-height: 1.3; letter-spacing: -.01em; }
.art-blog .ag-img { grid-row: 3 / 5; border-radius: 1.6cqw; background: linear-gradient(135deg, hsl(var(--h) 75% 70%), hsl(calc(var(--h) + 40) 70% 55%)); min-height: 16cqw; }
.art-blog .ag-toc { border: .4cqw solid hsl(var(--h) 60% 80%); border-radius: 1.4cqw; padding: 1.2cqw 1.6cqw; display: flex; flex-direction: column; gap: .9cqw; font-size: 2.2cqw; background: hsl(var(--h) 80% 97%); }

/* バナー */

.art-banner .ab-btn { display: inline-block; background: #fff; color: hsl(var(--h) 80% 30%); font-weight: 900; font-size: 3.2cqw; padding: 1.4cqw 3.6cqw; border-radius: 4cqw; }

/* 流れの図 */

.art-flow .af-row i::after { content: ""; position: absolute; right: -1cqw; top: -1.1cqw; border: 1.5cqw solid transparent; border-left-color: hsl(var(--h) 60% 45%); border-right: 0; }
.art-flow .af-box { flex: 1; background: #fff; border: .5cqw solid hsl(var(--h) 60% 70%); border-radius: 2cqw; padding: 2cqw 1cqw; display: flex; flex-direction: column; align-items: center; gap: 1cqw; font-size: 2.8cqw; font-weight: 800; text-align: center; }
.art-flow .af-box b { width: 5cqw; height: 5cqw; border-radius: 50%; display: grid; place-items: center; background: hsl(var(--h) 70% 42%); color: #fff; font-size: 2.6cqw; }

/* 動画のひとこま */
.art-video { background: #102030; }

.art-video .av-play { position: absolute; inset: 0; display: grid; place-items: center; }

.art-video .av-play span::after { content: ""; position: absolute; left: 5.2cqw; top: 3.6cqw; border: 2.9cqw solid transparent; border-left: 4.4cqw solid #102030; border-right: 0; }
.art-video .av-cap { position: absolute; left: 50%; bottom: 9cqw; transform: translateX(-50%); background: rgba(0,0,0,.55); color: #fff; font-weight: 800; font-size: 3.6cqw; padding: 1cqw 3cqw; border-radius: 1cqw; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.art-video .av-bar { position: absolute; left: 4cqw; right: 4cqw; bottom: 3.5cqw; height: 1cqw; border-radius: 1cqw; background: rgba(255,255,255,.35); }
.art-video .av-bar i { position: absolute; inset: 0 60% 0 0; background: #ff4f8b; border-radius: inherit; }

/* SNS の投稿ならび */
.art-sns { background: #fff; }
.art-sns .art-in { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2cqw; padding: 1.2cqw; }
.art-sns .as-post { border-radius: 1.2cqw; background: linear-gradient(135deg, hsl(calc(var(--h) + var(--k) * 35) 75% 68%), hsl(calc(var(--h) + var(--k) * 35 + 40) 75% 52%)); position: relative; }
.art-sns .as-post span { position: absolute; left: 18%; right: 18%; top: 40%; height: 18%; border-radius: 1cqw; background: rgba(255,255,255,.8); }

html[data-contrast="high"] .art { outline: 2px solid var(--ink); }

</style>

.en-kicker { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: .84rem; color: var(--primary-soft-ink); background: var(--primary-soft); padding: 6px 12px; border-radius: var(--r-full); }
.en-hero h1 { font-size: 2.3rem; line-height: 1.25; margin: 14px 0 12px; letter-spacing: .01em; }
.en-hero p { color: var(--ink-2); max-width: 34em; }
.en-hero-art { position: relative; display: flex; justify-content: center; padding: 10px 0 20px; }
.en-phone { width: 250px; border-radius: 34px; background: var(--surface); border: 8px solid #0f2a3c; box-shadow: var(--sh-3); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; transform: rotate(-3deg); }
.en-phone-bar { display: flex; justify-content: center; } .en-phone-bar span { width: 60px; height: 6px; border-radius: 3px; background: #0f2a3c; }
.en-ph-greet { font-weight: 900; font-size: .76rem; }
.en-ph-hero { border-radius: 14px; padding: 10px; color: #fff; background: linear-gradient(135deg, #0679ad, #00517f); display: flex; flex-direction: column; gap: 4px; font-size: .7rem; }
.en-ph-hero b { font-size: .64rem; letter-spacing: .08em; opacity: .9; }
.en-ph-hero span { font-weight: 900; font-size: .82rem; line-height: 1.35; }
.en-ph-hero i { font-style: normal; background: #fff; color: #0b4a68; border-radius: 8px; text-align: center; font-weight: 900; padding: 5px; margin-top: 4px; }
.en-ph-live { border-radius: 12px; padding: 8px 10px; color: #fff; background: linear-gradient(120deg, #e2367a, #6a2bb0); display: grid; grid-template-columns: 1fr auto; font-size: .66rem; }
.en-ph-live b { grid-column: 1; } .en-ph-live span { grid-column: 1; font-weight: 800; font-size: .74rem; }
.en-ph-live em { grid-column: 2; grid-row: 1 / 3; font-style: normal; font-weight: 900; font-size: 1.3rem; display: flex; align-items: baseline; gap: 2px; } .en-ph-live em small { font-size: .55rem; }
.en-ph-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .en-ph-row i { height: 44px; border-radius: 10px; background: var(--surface-3); }
.en-ph-tab { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding-top: 6px; border-top: 1px solid var(--line); } .en-ph-tab i { height: 18px; border-radius: 6px; background: var(--surface-3); } .en-ph-tab i:first-child { background: var(--primary-soft); }
.en-pk { position: absolute; right: max(0px, calc(50% - 190px)); bottom: -6px; transform: rotate(8deg); filter: drop-shadow(0 10px 18px rgba(0,0,0,.2)); }
@media (min-width: 900px) {
  .entrance { padding: 24px 32px 64px; gap: 40px; }
  .en-hero { grid-template-columns: 1.15fr 1fr; }
  .en-hero h1 { font-size: 3.4rem; }
  .en-hero p { font-size: 1.1rem; }
}
.en-doors { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .en-doors { grid-template-columns: repeat(3, 1fr); } }
.door { --d1: #0679ad; --d2: #00517f; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 22px; border-radius: var(--r-xl); color: #fff; background: linear-gradient(150deg, var(--d1), var(--d2)); box-shadow: 0 18px 40px -20px rgba(0, 50, 90, .6); transition: transform var(--t) var(--ease), box-shadow var(--t); isolation: isolate; }
.door::after { content: ""; position: absolute; width: 240px; height: 240px; right: -80px; top: -90px; border-radius: 50%; background: rgba(255,255,255,.16); z-index: -1; }
.door:hover { text-decoration: none; transform: translateY(-4px); box-shadow: 0 26px 50px -20px rgba(0, 50, 90, .7); }
.door-staff { --d1: #0c8268; --d2: #075e50; }
.door-admin { --d1: #2b3f8f; --d2: #141f4d; }
.door-ico .ico-badge { background: rgba(255,255,255,.18); color: #fff; }
.door-ico .pikuto { background: rgba(255,255,255,.18); border-radius: 18px; padding: 4px; }
.door-role { font-weight: 900; font-size: .86rem; letter-spacing: .06em; opacity: .9; }
.door-title { font-weight: 900; font-size: 1.35rem; line-height: 1.35; }
.door-list { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; font-weight: 700; }
.door-list span { display: flex; gap: 8px; align-items: flex-start; line-height: 1.5; }
.door-list .ico { margin-top: 3px; opacity: .9; }
.door-go { margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: var(--r-full); background: #fff; color: var(--d2); font-weight: 900; }
.door-go .count { border-color: #fff; }
html[data-contrast="high"] .door { border: 3px solid #000; }
.en-flows { display: flex; flex-direction: column; gap: 12px; }
.flow-card { position: relative; padding: 18px 18px 16px 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh-1); display: flex; flex-direction: column; gap: 10px; }
.flow-card ol { counter-reset: f; display: flex; flex-direction: column; gap: 8px; }
.flow-card li { counter-increment: f; display: grid; grid-template-columns: 26px 1fr; gap: 8px; font-size: .92rem; line-height: 1.55; }
.flow-card li::before { content: counter(f); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); font-weight: 900; font-size: .78rem; margin-top: 1px; }
.flow-no { position: absolute; right: 14px; top: 10px; font-size: 2.4rem; font-weight: 900; color: var(--surface-3); line-height: 1; }
.en-foot { color: var(--ink-3); font-size: .84rem; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 18px; }
@media (max-width: 599px) { .en-hero-art { display: none; } .en-hero h1 { font-size: 2.1rem; } }

</style>

<script>/* js/core.js */
/* =========================================================
   しくみ：データの保存・画面の切りかえ・よく使う道具
   （サーバーなしで動く。データはこの端末のブラウザに保存）
   ========================================================= */
(function () {
  'use strict';

  /* ---------- 小さな道具 ---------- */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ESC[c]);

  class Safe { constructor(s) { this.s = s; } toString() { return this.s; } }
  const raw = (s) => new Safe(String(s == null ? '' : s));
  function toHtml(v) {
    if (v == null || v === false || v === true) return '';
    if (v instanceof Safe) return v.s;
    if (Array.isArray(v)) return v.map(toHtml).join('');
    return esc(v);
  }
  /** 埋めこむ値は自動でエスケープするテンプレート */
  function html(strings, ...vals) {
    let out = strings[0];
    for (let i = 0; i < vals.length; i++) {
      const v = vals[i];
      // 属性の中（aria-pressed="${真偽}" など）では true / false をそのまま書く
      if (typeof v === 'boolean' && /=\s*"$/.test(strings[i])) out += String(v);
      else out += toHtml(v);
      out += strings[i + 1];
    }
    return new Safe(out);
  }
  const ic = (name, opts) => raw(Icons.icon(name, opts));
  const uid = (p) => (p || 'id') + '-' + Math.random().toString(36).slice(2, 9);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
  const by = (k, dir) => (a, b) => ((a[k] > b[k]) - (a[k] < b[k])) * (dir === 'desc' ? -1 : 1);
  function groupBy(arr, f) { const m = new Map(); arr.forEach((x) => { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; }
  function rng(seed) { // 決まった並びの乱数（架空データ用）
    let a = seed >>> 0;
    return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  /* ---------- 時計（試作では 2026年10月26日（月）に固定） ---------- */
  const DEMO_DAY = '2026-10-26';
  const PRESETS = {
    morning: { time: '09:52', label: '朝 9:52（授業の前）' },
    live:    { time: '10:24', label: '10:24（授業LIVE中）' },
    evening: { time: '15:40', label: '夕方 15:40（一日のおわり）' }
  };
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const t0 = Date.now();
  const Clock = {
    frozen: /[?&]shot=1/.test(location.search) || /shot=1/.test(location.hash),
    presetKey() { const s = Store.state; return (s && s.clock) || 'morning'; },
    base() { return new Date(`${DEMO_DAY}T${PRESETS[this.presetKey()].time}:00+09:00`).getTime(); },
    now() { return new Date(this.base() + (this.frozen ? 0 : Math.min(Date.now() - t0, 6 * 3600e3))); },
    /** その時刻を日本時間の「時:分」の数（分）にする */
    minutes(d) { const j = jst(d || this.now()); return j.h * 60 + j.mi; },
    at(hhmm, day) { return new Date(`${day || DEMO_DAY}T${hhmm}:00+09:00`); }
  };
  function jst(d) {
    const x = new Date((d instanceof Date ? d.getTime() : new Date(d).getTime()) + 9 * 3600e3);
    return { y: x.getUTCFullYear(), m: x.getUTCMonth() + 1, d: x.getUTCDate(), h: x.getUTCHours(), mi: x.getUTCMinutes(), wd: x.getUTCDay(), date: x.toISOString().slice(0, 10) };
  }
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = {
    date(d) { const j = jst(d); return `${j.m}月${j.d}日（${WD[j.wd]}）`; },
    dateShort(d) { const j = jst(d); return `${j.m}/${j.d}（${WD[j.wd]}）`; },
    md(d) { const j = jst(d); return `${j.m}/${j.d}`; },
    time(d) { const j = jst(d); return `${j.h}:${pad(j.mi)}`; },
    dt(d) { return `${fmt.dateShort(d)} ${fmt.time(d)}`; },
    dur(min) { min = Math.max(0, Math.round(min)); const h = Math.floor(min / 60), m = min % 60; return h ? (m ? `${h}時間${m}分` : `${h}時間`) : `${m}分`; },
    durShort(min) { min = Math.max(0, Math.round(min)); const h = Math.floor(min / 60), m = min % 60; return h ? `${h}:${pad(m)}` : `${m}分`; },
    ago(d) {
      const diff = (Clock.now() - new Date(d)) / 60000;
      if (diff < 1) return 'いま';
      if (diff < 60) return `${Math.floor(diff)}分前`;
      if (diff < 60 * 24 && jst(d).date === jst(Clock.now()).date) return `${Math.floor(diff / 60)}時間前`;
      const days = Math.floor((new Date(jst(Clock.now()).date) - new Date(jst(d).date)) / 864e5);
      if (days === 1) return 'きのう';
      if (days < 7) return `${days}日前`;
      return fmt.md(d);
    },
    daysLeft(due) {
      if (!due) return null;
      const a = new Date(jst(Clock.now()).date), b = new Date(jst(due).date);
      return Math.round((b - a) / 864e5);
    },
    weekday(d) { return WD[jst(d).wd]; }
  };

  /* ---------- 保存（この端末のブラウザの中だけ） ---------- */
  const KEY = 'es-school-proto-v3';
  const listeners = new Set();
  const Store = {
    state: null,
    load() {
      let s = null;
      try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { s = null; }
      if (!s || s.v !== window.SEED_VERSION) s = window.makeSeed();
      this.state = s;
      return s;
    },
    save() { try { localStorage.setItem(KEY, JSON.stringify(this.state)); } catch (e) { /* 保存できない時もそのまま動く */ } },
    update(fn, opts) {
      fn(this.state);
      this.save();
      if (!(opts && opts.silent)) listeners.forEach((l) => l(opts || {}));
    },
    reset() { localStorage.removeItem(KEY); this.state = window.makeSeed(); this.save(); },
    on(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  };
  // ほかのタブで変わったら、こちらも読み直す（利用者→職員→運営 がつながって見える）
  window.addEventListener('storage', (e) => {
    if (e.key !== KEY) return;
    Store.load();
    App.applySettings();
    App.refresh({ fromOtherTab: true });
  });

  /* ---------- 画面の切りかえ（#/役わり/ページ） ---------- */
  function parseHash() {
    const h = location.hash.replace(/^#\/?/, '');
    const [pathPart, qs] = h.split('?');
    const parts = pathPart.split('/').filter(Boolean);
    const query = {};
    (qs || '').split('&').filter(Boolean).forEach((kv) => { const [k, v] = kv.split('='); query[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
    return { role: parts[0] || '', parts: parts.slice(1), query };
  }
  function matchRoute(routes, parts) {
    for (const pattern of Object.keys(routes)) {
      const pp = pattern.split('/').filter(Boolean);
      if (pp.length !== parts.length) continue;
      const params = {};
      let ok = true;
      for (let i = 0; i < pp.length; i++) {
        if (pp[i].startsWith(':')) params[pp[i].slice(1)] = decodeURIComponent(parts[i]);
        else if (pp[i] !== parts[i]) { ok = false; break; }
      }
      if (ok) return { pattern, params, fn: routes[pattern] };
    }
    return null;
  }

  function focusKey(el) {
    if (!el || el === document.body || !el.closest || !el.closest('#app')) return null;
    if (el.id) return '#' + CSS.escape(el.id);
    const attrs = ['data-act', 'data-change', 'data-input', 'data-go', 'data-id', 'data-key', 'data-v', 'data-i', 'data-k', 'name', 'href'];
    const parts = attrs.filter((a) => el.hasAttribute(a)).map((a) => `[${a}="${CSS.escape(el.getAttribute(a))}"]`);
    return parts.length ? el.tagName.toLowerCase() + parts.join('') : null;
  }

  /* ---------- アプリ本体 ---------- */
  const App = {
    roles: {},
    current: null,
    shellRole: null,
    lastKey: '',
    deferred: false,
    register(name, def) { this.roles[name] = def; },
    go(path) { if (location.hash === path) this.render(); else location.hash = path; },
    back(fallback) {
      if (history.length > 1 && this._navCount > 1) history.back();
      else location.hash = fallback;
    },
    _navCount: 0,

    settings() {
      const s = Store.state.settings;
      const role = this.current ? this.current.role : 'learner';
      return s[role] || s.learner;
    },
    applySettings() {
      const r = parseHash().role || 'entrance';
      const roleKey = ['learner', 'staff', 'admin'].includes(r) ? r : 'learner';
      const st = Store.state.settings[roleKey] || Store.state.settings.learner;
      const root = document.documentElement;
      root.dataset.role = r;
      root.dataset.fs = String(st.fs || 1);
      root.dataset.theme = st.theme === 'dark' ? 'dark' : 'light';
      root.dataset.contrast = st.contrast ? 'high' : 'normal';
      root.dataset.motion = st.reduceMotion ? 'reduce' : 'normal';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = st.theme === 'dark' ? '#0a1620' : '#ffffff';
    },

    render(opts) {
      const o = opts || {};
      const r = parseHash();
      const roleName = r.role || 'entrance';
      const role = this.roles[roleName] || this.roles.entrance;
      const m = matchRoute(role.routes, r.parts) || matchRoute(role.routes, [role.home || 'home']);
      const route = { role: roleName, parts: r.parts, params: m.params, query: r.query, pattern: m.pattern };
      const key = location.hash;
      const samePage = key === this.lastKey;
      this.current = route;
      this.applySettings();
      UI.stopSpeak();
      // 画面がかわったら、開いたままのシートは閉じる（もどるボタンで戻った時など）
      if (!samePage) { $$('.sheet-wrap').forEach((w) => w.remove()); document.body.style.overflow = ''; }

      let page;
      try { page = m.fn(route) || {}; }
      catch (err) { console.error(err); page = { title: 'エラー', html: html`<div class="card card-pad"><p>この画面を開けませんでした。</p><pre class="small">${String(err && err.stack || err)}</pre></div>` }; }
      this.page = page;
      document.title = (page.title ? page.title + '｜' : '') + 'エスピクトスクール（試作）';

      const appEl = $('#app');
      const focusSel = samePage ? focusKey(document.activeElement) : null;
      if (role.shell) {
        const scrollY = window.scrollY;
        appEl.innerHTML = toHtml(role.shell(route, page));
        const main = $('#main');
        if (main) {
          main.className = 'main' + (page.wide ? ' main-wide' : '') + (page.flush ? ' main-flush' : '');
          main.innerHTML = toHtml(page.html);
        }
        if (samePage && !o.toTop) window.scrollTo(0, scrollY);
        else if (!o.keepScroll) window.scrollTo(0, 0);
      } else {
        appEl.innerHTML = toHtml(page.html);
        if (!samePage) window.scrollTo(0, 0);
      }
      if (page.mount) { try { page.mount($('#main') || appEl, route); } catch (err) { console.error(err); } }
      if (roleName === 'learner' && this.settings().furigana) Furi.apply(appEl);
      if (!samePage) {
        this._navCount++;
        const h1 = $('#main h1, #app h1');
        if (h1 && this._navCount > 1) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
      }
      this.lastKey = key;
      UI.renderToastsHost();
      // 描きなおしても、さっきまで選んでいたボタンにフォーカスをもどす（キーボードで使う人のため）
      if (focusSel) { const el = $(focusSel); if (el) el.focus({ preventScroll: true }); }
    },
    /** データが変わった時に今の画面を描きなおす（入力中ならあとで） */
    refresh(opts) {
      const a = document.activeElement;
      if (a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type === 'text')) && a.closest('#app')) {
        this.deferred = true;
        return;
      }
      if (this.page && this.page.onRefresh && opts && opts.fromOtherTab) { this.page.onRefresh(); return; }
      this.render(Object.assign({ keepScroll: true }, opts));
    },
    start() {
      Store.load();
      Store.save();
      this.applySettings();
      window.addEventListener('hashchange', () => this.render());
      document.addEventListener('focusout', () => {
        setTimeout(() => {
          if (!this.deferred) return;
          const a = document.activeElement;
          if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')) return;
          this.deferred = false;
          this.render({ keepScroll: true });
        }, 50);
      });
      this.render();
      // 時計を進める（カウントダウンなど）
      if (!Clock.frozen) setInterval(() => { document.dispatchEvent(new CustomEvent('tick')); }, 1000);
    }
  };

  /* ---------- 操作の受け口（data-act="名前"） ---------- */
  const Actions = {};
  function act(name, fn) { Actions[name] = fn; }
  document.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (go && !go.disabled) { e.preventDefault(); App.go(go.getAttribute('data-go')); return; }
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
    const name = el.getAttribute('data-act');
    const fn = Actions[name];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-change]');
    if (!el) return;
    const fn = Actions[el.getAttribute('data-change')];
    if (fn) fn(el, e);
  });
  document.addEventListener('input', (e) => {
    const el = e.target.closest('[data-input]');
    if (!el) return;
    const fn = Actions[el.getAttribute('data-input')];
    if (fn) fn(el, e);
  });
  document.addEventListener('submit', (e) => {
    const el = e.target.closest('[data-submit]');
    if (!el) return;
    e.preventDefault();
    const fn = Actions[el.getAttribute('data-submit')];
    if (fn) fn(el, e);
  });

  /* ---------- 画面の部品（トースト・シート・紙ふぶき・読み上げ） ---------- */
  const UI = {
    renderToastsHost() {
      if (!$('#toasts')) { const d = document.createElement('div'); d.id = 'toasts'; d.className = 'toasts'; d.setAttribute('role', 'status'); d.setAttribute('aria-live', 'polite'); document.body.appendChild(d); }
    },
    toast(text, opts) {
      const o = opts || {};
      this.renderToastsHost();
      const host = $('#toasts');
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `<span class="t-ico">${Icons.icon(o.icon || 'checkc')}</span><span class="t-text">${esc(text)}</span>` + (o.action ? `<button class="t-act" type="button">${esc(o.action)}</button>` : '');
      host.appendChild(el);
      if (App.current && App.current.role === 'learner' && App.settings().furigana) Furi.apply(el);
      let closed = false;
      const close = () => { if (closed) return; closed = true; el.classList.add('out'); setTimeout(() => el.remove(), 220); };
      if (o.action) el.querySelector('.t-act').addEventListener('click', () => { o.onAction && o.onAction(); close(); });
      setTimeout(close, o.ms || (o.action ? 6000 : 3200));
      return close;
    },
    /** シート（スマホは下から、PCはまん中）。content は html。戻り値は閉じる関数 */
    sheet(opts) {
      const o = opts || {};
      const wrap = document.createElement('div');
      wrap.className = 'sheet-wrap';
      wrap.innerHTML = `<div class="sheet${o.wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="grab" aria-hidden="true"></div>
        <div class="sheet-head">${o.icon ? `<span class="ico-badge ${o.iconCls || ''}">${o.icon}</span>` : ''}<h2 id="sheet-title">${toHtml(o.title || '')}</h2>
          <button class="icon-btn" type="button" data-close aria-label="とじる">${Icons.icon('x')}</button></div>
        <div class="sheet-body">${toHtml(o.body || '')}</div>
        ${o.foot ? `<div class="sheet-foot">${toHtml(o.foot)}</div>` : ''}
      </div>`;
      const prevFocus = document.activeElement;
      document.body.appendChild(wrap);
      document.body.style.overflow = 'hidden';
      const close = (val) => {
        if (wrap.classList.contains('closing')) return;
        wrap.classList.add('closing');
        document.removeEventListener('keydown', onKey);
        setTimeout(() => { wrap.remove(); if (!$('.sheet-wrap')) document.body.style.overflow = ''; if (prevFocus && prevFocus.focus) prevFocus.focus({ preventScroll: true }); }, 200);
        o.onClose && o.onClose(val);
      };
      const onKey = (e) => { if (e.key === 'Escape') close(); };
      document.addEventListener('keydown', onKey);
      wrap.addEventListener('click', (e) => {
        if (e.target === wrap || e.target.closest('[data-close]')) close();
      });
      if (App.current && App.current.role === 'learner' && App.settings().furigana) Furi.apply(wrap);
      // 開いたら、シートそのものにフォーカス（ボタンを勝手に選ばない。読み上げは見出しから）
      const sheetEl = wrap.querySelector('.sheet');
      sheetEl.setAttribute('tabindex', '-1');
      const first = wrap.querySelector('[autofocus]');
      setTimeout(() => (first || sheetEl).focus({ preventScroll: true }), 60);
      if (o.mount) o.mount(wrap.querySelector('.sheet'), close);
      return close;
    },
    confirm(opts) {
      return new Promise((resolve) => {
        let done = false;
        const close = UI.sheet({
          title: opts.title, icon: opts.icon, iconCls: opts.iconCls,
          body: html`<p class="ink2">${opts.text || ''}</p>${opts.extra || ''}`,
          foot: html`<button class="btn btn-lg" type="button" data-close>${opts.no || 'やめる'}</button><button class="btn btn-lg ${opts.danger ? 'btn-danger' : 'btn-primary'}" type="button" data-yes>${opts.yes || 'はい'}</button>`,
          mount: (el, c) => { el.querySelector('[data-yes]').addEventListener('click', () => { done = true; c(true); resolve(true); }); },
          onClose: () => { if (!done) resolve(false); }
        });
        return close;
      });
    },
    confetti() {
      if (document.documentElement.dataset.motion === 'reduce' || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const box = document.createElement('div');
      box.className = 'confetti';
      const colors = ['#00b8ec', '#e2367a', '#ffc53d', '#57d39a', '#6a4fcf', '#ff8fb8'];
      for (let i = 0; i < 90; i++) {
        const c = document.createElement('i');
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = colors[i % colors.length];
        c.style.animationDuration = 1.8 + Math.random() * 1.6 + 's';
        c.style.animationDelay = Math.random() * .4 + 's';
        c.style.transform = `rotate(${Math.random() * 360}deg)`;
        c.style.opacity = .9;
        box.appendChild(c);
      }
      document.body.appendChild(box);
      setTimeout(() => box.remove(), 4000);
    },
    /* 読み上げ（端末の声を使う。ネットはいらない） */
    _speakBtn: null,
    speak(text, btn) {
      const synth = window.speechSynthesis;
      if (!synth) { UI.toast('この端末では読み上げが使えません', { icon: 'info' }); return; }
      if (this._speakBtn && this._speakBtn === btn && synth.speaking) { this.stopSpeak(); return; }
      this.stopSpeak();
      const u = new SpeechSynthesisUtterance(String(text).replace(/[「」『』【】]/g, ' '));
      u.lang = 'ja-JP';
      const st = App.settings();
      u.rate = st.speechRate || 0.95;
      const v = synth.getVoices().find((x) => /ja[-_]JP/i.test(x.lang));
      if (v) u.voice = v;
      if (btn) { btn.setAttribute('aria-pressed', 'true'); this._speakBtn = btn; }
      u.onend = u.onerror = () => { if (btn) btn.setAttribute('aria-pressed', 'false'); if (this._speakBtn === btn) this._speakBtn = null; };
      synth.speak(u);
    },
    stopSpeak() {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (this._speakBtn) { this._speakBtn.setAttribute('aria-pressed', 'false'); this._speakBtn = null; }
    },
    /** 読み上げボタンの html（data-say に読む文） */
    speakBtn(text, label) {
      return html`<button class="speak" type="button" data-act="say" data-say="${text}" aria-pressed="false" aria-label="${label || '読み上げる'}">${ic('volume')}<span>${label || 'よむ'}</span></button>`;
    },
    /** CSV を作ってダウンロード（本当にファイルになる） */
    download(name, text, type) {
      const blob = new Blob(['﻿' + text], { type: type || 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
  };
  act('say', (el) => {
    let text = el.getAttribute('data-say');
    if (!text) { const t = el.closest('[data-say-root]'); text = t ? t.innerText : ''; }
    UI.speak(text, el);
  });
  act('noop', () => UI.toast('試作なので、ここはまだ動きません', { icon: 'info' }));

  /* ---------- ふりがな（よく出ることばに、よみがなをつける） ---------- */
  const KANJI = /[一-鿿々]/;
  const Furi = {
    dict: null,
    parts: null,
    re: null,
    /** 「作ります」「つくります」→ [["作","つく"],["ります",null]]（送りがなには つけない） */
    align(word, reading) {
      const segs = word.match(/[一-鿿々]+|[^一-鿿々]+/g) || [word];
      const esc2 = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp('^' + segs.map((sg) => (KANJI.test(sg) ? '(.+?)' : esc2(sg))).join('') + '$');
      const m = reading.match(re);
      if (!m) return [[word, reading]];
      let gi = 1;
      return segs.map((sg) => (KANJI.test(sg) ? [sg, m[gi++]] : [sg, null]));
    },
    build() {
      const d = window.FURIGANA || {};
      const keys = Object.keys(d).sort((a, b) => b.length - a.length);
      this.dict = d;
      this.parts = {};
      keys.forEach((k) => { this.parts[k] = this.align(k, d[k]); });
      this.re = keys.length ? new RegExp(keys.map((k) => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g') : null;
    },
    apply(root) {
      if (!this.re) this.build();
      if (!this.re) return;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: (n) => {
          const p = n.parentElement;
          if (!p || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          if (p.closest('ruby, rt, script, style, textarea, input, select, code, pre, svg, [data-noruby], .sr-only, .furi, .art, .thumb')) return NodeFilter.FILTER_REJECT;
          return KANJI.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
        }
      });
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach((n) => {
        const text = n.nodeValue;
        this.re.lastIndex = 0;
        if (!this.re.test(text)) return;
        this.re.lastIndex = 0;
        // ひとつの span にまとめる（グリッドやフレックスの中でも ばらばらにならない）
        const wrap = document.createElement('span');
        wrap.className = 'furi';
        let last = 0;
        text.replace(this.re, (m, idx) => {
          if (idx > last) wrap.appendChild(document.createTextNode(text.slice(last, idx)));
          (this.parts[m] || [[m, this.dict[m]]]).forEach(([base, yomi]) => {
            if (!yomi) { wrap.appendChild(document.createTextNode(base)); return; }
            const r = document.createElement('ruby');
            r.appendChild(document.createTextNode(base));
            const rt = document.createElement('rt');
            rt.textContent = yomi;
            r.appendChild(rt);
            wrap.appendChild(r);
          });
          last = idx + m.length;
          return m;
        });
        if (last < text.length) wrap.appendChild(document.createTextNode(text.slice(last)));
        n.parentNode.replaceChild(wrap, n);
      });
    }
  };

  /* ---------- グラフ（棒グラフ：1つの系列。ホバーで値、表でも見られる） ---------- */
  const Charts = {
    _specs: {},
    /** data: [{label, short?, value, dim?}]。画面に出た時に、実際の はばで描きなおす */
    bars(data, opts) {
      const o = Object.assign({ height: 180, unit: '', max: null, id: uid('viz'), title: '', fmt: (v) => String(v) }, opts || {});
      this._specs[o.id] = { data, o };
      const table = `<table class="table viz-table" hidden><thead><tr><th>${esc(o.xName || '日')}</th><th class="num">${esc(o.yName || '数')}</th></tr></thead><tbody>${data.map((d) => `<tr><td>${esc(d.label)}</td><td class="num">${esc(o.fmt(d.value))}${esc(o.unit)}</td></tr>`).join('')}</tbody></table>`;
      return raw(`<figure class="viz" id="${o.id}" data-viz>
        ${this._svg(data, o, 600)}
        <div class="viz-foot"><button class="linkbtn" type="button" data-act="viz-table">${Icons.icon('table')}<span>表で見る</span></button></div>
        ${table}
      </figure>`);
    },
    _svg(data, o, W) {
      const H = o.height, padL = 34, padR = 8, padT = 18, padB = 26;
      const max = o.max || Math.max(1, ...data.map((d) => d.value));
      const niceMax = niceCeil(max);
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const n = data.length;
      const band = plotW / Math.max(1, n);
      const bw = Math.max(4, Math.min(24, band * 0.62));
      const ticks = [0, niceMax / 2, niceMax];
      let g = '';
      ticks.forEach((t) => {
        const y = padT + plotH - (t / niceMax) * plotH;
        g += `<line class="${t === 0 ? 'v-axis' : 'v-grid'}" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/>`;
        g += `<text class="v-tick" x="${padL - 6}" y="${y + 4}" text-anchor="end">${esc(o.fmt(t))}</text>`;
      });
      let bars = '';
      const maxLabels = Math.max(4, Math.floor(plotW / 34));
      const labelEvery = n > maxLabels ? Math.ceil(n / maxLabels) : 1;
      data.forEach((d, i) => {
        const x = padL + band * i + (band - bw) / 2;
        const h = (d.value / niceMax) * plotH;
        const y = padT + plotH - h;
        const r = Math.min(4, h / 2, bw / 2);
        const path = h > 0 ? `M${x},${padT + plotH} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${padT + plotH} Z` : '';
        const tip = `${d.label}：${o.fmt(d.value)}${o.unit}`;
        bars += `<rect class="v-hit" x="${padL + band * i}" y="${padT}" width="${band}" height="${plotH}" tabindex="0" aria-label="${esc(tip)}" data-tip="${esc(tip)}" data-x="${padL + band * i + band / 2}" data-y="${y}"/>`;
        bars += `<path class="v-bar${d.dim ? ' is-dim' : ''}" d="${path}"/>`;
        if (i % labelEvery === 0 || i === n - 1) bars += `<text class="v-tick" x="${padL + band * i + band / 2}" y="${H - 8}" text-anchor="middle">${esc(d.short || d.label)}</text>`;
      });
      if (o.highlightLast && n) {
        const d = data[n - 1];
        const y = padT + plotH - (d.value / niceMax) * plotH;
        bars += `<text class="v-label" x="${padL + band * (n - 1) + band / 2}" y="${y - 6}" text-anchor="middle">${esc(o.fmt(d.value))}</text>`;
      }
      return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="${esc(o.title)}">${g}${bars}</svg>`;
    },
    mount(root) {
      $$('[data-viz]', root).forEach((fig) => {
        const spec = this._specs[fig.id];
        if (spec) {
          const w = Math.max(260, Math.round(fig.clientWidth || 600));
          const old = fig.querySelector('svg');
          const tmp = document.createElement('div');
          tmp.innerHTML = this._svg(spec.data, spec.o, w);
          old.replaceWith(tmp.firstElementChild);
        }
        const svg = fig.querySelector('svg');
        let tip = null;
        const show = (el) => {
          if (!tip) { tip = document.createElement('div'); tip.className = 'viz-tip'; fig.appendChild(tip); }
          const bb = svg.getBoundingClientRect(), fb = fig.getBoundingClientRect();
          const sx = bb.width / svg.viewBox.baseVal.width, sy = bb.height / svg.viewBox.baseVal.height;
          tip.textContent = el.getAttribute('data-tip');
          tip.style.left = Math.min(fb.width - 40, Math.max(40, bb.left - fb.left + Number(el.getAttribute('data-x')) * sx)) + 'px';
          tip.style.top = (bb.top - fb.top + Number(el.getAttribute('data-y')) * sy) + 'px';
          tip.style.display = 'block';
        };
        const hide = () => { if (tip) tip.style.display = 'none'; };
        fig.querySelectorAll('.v-hit').forEach((h) => {
          h.addEventListener('pointerenter', () => show(h));
          h.addEventListener('focus', () => show(h));
          h.addEventListener('pointerleave', hide);
          h.addEventListener('blur', hide);
        });
      });
    }
  };
  function niceCeil(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const f = v / p;
    const n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return n * p;
  }
  act('viz-table', (el) => {
    const fig = el.closest('[data-viz]');
    const t = fig.querySelector('.viz-table');
    t.hidden = !t.hidden;
    el.querySelector('span').textContent = t.hidden ? '表で見る' : '表をとじる';
  });

  window.Core = { $, $$, esc, raw, html, toHtml, ic, uid, clamp, sum, by, groupBy, rng, hashStr, jst, fmt, pad, DEMO_DAY, PRESETS, WD };
  window.Clock = Clock;
  window.Store = Store;
  window.App = App;
  window.UI = UI;
  window.act = act;

<script>/* js/art.js */
/* =========================================================
   作品の見本（ブログ・バナー・図・動画・SNS）を HTML で描く
   ========================================================= */
(function () {
  const { esc } = Core;
  function preview(kind, o) {
    const opt = Object.assign({ hue: 200, title: '文字起こしってどんな仕事？', sub: 'エスピクトスクールの記事', big: false }, o || {});
    const h = opt.hue;
    const style = `--h:${h}`;
    const t = esc(opt.title);
    if (kind === 'banner') {
      return `<div class="art art-banner" style="${style}" aria-hidden="true"><div class="art-in">
        <div class="ab-shape s1"></div><div class="ab-shape s2"></div>
        <div class="ab-text"><div class="ab-kicker">${esc(opt.sub)}</div><div class="ab-title">${t}</div><div class="ab-btn">相談する →</div></div>
      </div></div>`;
    }
    if (kind === 'flow') {
      return `<div class="art art-flow" style="${style}" aria-hidden="true"><div class="art-in"><div class="af-title">${t}</div>
        <div class="af-row">${['相談', '見つもり', 'お願い', '作る', 'とどける'].map((s, i) => `<div class="af-box"><b>${i + 1}</b><span>${s}</span></div>`).join('<i></i>')}</div></div></div>`;
    }
    if (kind === 'video') {
      return `<div class="art art-video" style="${style}" aria-hidden="true"><div class="art-in"><div class="av-sky"></div><div class="av-hill"></div><div class="av-sun"></div>
        <div class="av-play"><span></span></div><div class="av-cap">${t}</div><div class="av-bar"><i></i></div></div></div>`;
    }
    if (kind === 'sns') {
      return `<div class="art art-sns" style="${style}" aria-hidden="true"><div class="art-in">${[0, 1, 2, 3, 4, 5].map((i) => `<div class="as-post" style="--k:${i}"><span></span></div>`).join('')}</div></div>`;
    }
    // blog（ページの見本）
    return `<div class="art art-blog" style="${style}" aria-hidden="true"><div class="art-in">
      <div class="ag-bar"><i></i><i></i><i></i><span></span></div>
      <div class="ag-page">
        <div class="ag-head"><span class="ag-logo"></span><span class="ag-nav"></span></div>
        <div class="ag-title">${t}</div>
        <div class="ag-img"></div>
        <div class="ag-toc"><b>目次</b><span></span><span></span><span></span></div>
        <div class="ag-lines"><span></span><span></span><span style="width:70%"></span></div>
      </div>
    </div></div>`;
  }
  window.Art = { preview };
})();

</script>
